<style>
:root{
  --bg:#f3f1ee;--card:#fff;--ink:#1d1b1a;--mut:#6d6863;--line:#e4e0db;
  --red:#d91f1b;--red2:#a3150f;--redbg:#fdecea;--brn:#7b684d;--brnbg:#f1ece4;
  --amb:#a86200;--ambbg:#fff3df;--grn:#1d7a46;--grnbg:#e5f4ec;--blu:#245f9e;--blubg:#e6eff9;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#dcd8d3;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
#app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px;box-shadow:0 0 40px rgba(0,0,0,.08)}
header.top{background:var(--red);color:#fff;padding:16px 18px 14px;position:sticky;top:0;z-index:5}
header.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px}
header.top .sub{font-size:12.5px;opacity:.85;margin-top:2px}
header.top select{max-width:170px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
header.top select option{color:#000}
.back{background:none;border:0;color:#fff;font-size:22px;padding:0 8px 0 0;cursor:pointer;line-height:1}
main{padding:14px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:18px;font-weight:600;margin-top:3px}
.list .it{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.it .main{flex:1;min-width:0}
.it .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .meta{font-size:12px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.it .amt{text-align:right;font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:500;padding:2px 7px;border-radius:99px;background:#eee;color:#444;white-space:nowrap}
.c-red{background:var(--redbg);color:var(--red)}.c-amb{background:var(--ambbg);color:var(--amb)}.c-grn{background:var(--grnbg);color:var(--grn)}.c-blu{background:var(--blubg);color:var(--blu)}
.num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#efece8;font-weight:600;font-size:13px;flex:none}
.num.done{background:var(--grnbg);color:var(--grn)}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:10px 0 12px;font:inherit;font-size:11.5px;color:var(--mut);cursor:pointer;position:relative}
nav.tabs button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
nav.tabs button.on{color:var(--red);font-weight:600}
.badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;border-radius:99px;padding:1px 5px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;background:var(--red);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--red);padding:6px 8px}
.btn.sm{padding:7px 10px;font-size:12.5px;border-radius:8px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.steps{display:flex;gap:4px;padding:10px 14px 0;overflow-x:auto;scrollbar-width:none}
.steps button{flex:none;border:0;background:#e9e6e2;color:var(--mut);border-radius:99px;font:inherit;font-size:12px;padding:6px 10px;cursor:pointer}
.steps button.on{background:var(--ink);color:#fff}
.steps button.ok{background:var(--grnbg);color:var(--grn)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--mut);font-weight:500;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.3px}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
input,select,textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:#fff;color:var(--ink);width:100%}
input.q{width:58px;text-align:center;padding:6px 4px}
label.f{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk:last-child{border-bottom:0}
.chk input[type=checkbox]{width:20px;height:20px;accent-color:var(--grn);flex:none}
.alert{border-radius:12px;padding:11px 12px;font-size:13px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.alert.red{background:var(--redbg);color:var(--red2)}.alert.amb{background:var(--ambbg);color:#7a4700}.alert.grn{background:var(--grnbg);color:var(--grn)}.alert.blu{background:var(--blubg);color:var(--blu)}
.alert b{font-weight:600}
.tot{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0}
.tot.big{font-size:17px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.foot{position:sticky;bottom:72px;padding:10px 0 0;display:flex;gap:8px}
.inv-doc{border:1px dashed #cfc9c2;border-radius:10px;padding:14px;background:#fffdfa}
.inv-doc .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.bar{height:10px;border-radius:5px;background:#eee;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--mut);margin-top:8px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.seg{display:flex;background:#e9e6e2;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.modal{position:fixed;inset:0;background:rgba(20,15,10,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:16px}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:30;max-width:90%;text-align:center}
.muted{color:var(--mut);font-size:12.5px}
.sec-t{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 8px}
.photo{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:8px}
pre.rep{white-space:pre-wrap;font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:#f6f4f1;border-radius:10px;padding:10px;margin:0;max-height:260px;overflow:auto}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.pipe button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 6px;text-align:left;font:inherit;cursor:pointer}
.pipe button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pipe .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut)}
.pipe .v{font-size:18px;font-weight:600}.pipe .m{font-size:11px;color:var(--mut)}
.dots{display:flex;gap:3px;margin-top:5px}.dots i{width:16px;height:4px;border-radius:2px;background:#e4e0db}.dots i.on{background:var(--ink)}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{display:flex;gap:10px;padding:0 0 14px;position:relative;font-size:13.5px}
.tl li:before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl .d{width:18px;height:18px;border-radius:50%;border:2px solid #cfc9c2;background:#fff;flex:none;z-index:1}
.tl li.on .d{background:var(--grn);border-color:var(--grn)}
.tl li.cur .d{background:#fff;border-color:var(--ink);box-shadow:0 0 0 3px #e9e6e2}
.sel{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.sel.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:#fffafa}
.bell{position:relative;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;width:34px;height:32px;display:grid;place-items:center;cursor:pointer;flex:none}
.bell .badge{top:-6px;left:auto;right:-6px}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 20px 40px;background:var(--bg)}
.brand{font-weight:700;letter-spacing:3px;color:var(--red);font-size:22px;margin:18px 0 26px;text-align:center}
.brand span{display:block;font-size:12px;letter-spacing:4px;color:var(--mut);font-weight:500;margin-top:2px;text-transform:uppercase}
.login h2{font-size:22px;margin:6px 0 10px;text-align:center}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.who button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 10px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
.who button:active{transform:scale(.98)}
.av{width:44px;height:44px;border-radius:50%;background:var(--redbg);color:var(--red);display:inline-grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.av.big{width:72px;height:72px;font-size:24px;margin:10px auto 8px}.av.adm{background:var(--ink);color:#fff}
.av.sm{width:28px;height:28px;font-size:11px;margin-right:8px;vertical-align:middle}
.dotsp{display:flex;gap:16px;justify-content:center;margin:8px 0}.dotsp i{width:16px;height:16px;border-radius:50%;border:2px solid #b9b2aa}.dotsp i.on{background:var(--red);border-color:var(--red)}
.perr{color:var(--red);font-size:14px;height:22px;text-align:center;font-weight:500}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:8px}
.pad button{height:76px;border-radius:50%;border:0;background:#fff;font:inherit;font-size:26px;font-weight:500;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);color:var(--ink)}
.pad button:active{background:#eee}
.meb{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--red);border:0;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.hello{background:var(--red);color:#fff;border-radius:18px;padding:16px 16px 14px;margin-bottom:14px}
.hello .hn{font-size:26px;font-weight:700;margin:2px 0 12px}
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hs div{background:rgba(255,255,255,.13);border-radius:12px;padding:9px}
.hs b{display:block;font-size:16px}.hs span{font-size:11.5px;opacity:.85}
.bigg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigb{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--ink);min-height:118px}
.bigb .bi{width:40px;height:40px;border-radius:12px;background:#f1eeea;display:grid;place-items:center;margin-bottom:6px}.bigb .bi svg{width:22px;height:22px}
.bigb .bl{font-size:16px;font-weight:600}.bigb .bs{font-size:12.5px;color:var(--mut)}
.bigb.pri{background:var(--red);color:#fff;border-color:var(--red)}.bigb.pri .bi{background:rgba(255,255,255,.18)}.bigb.pri .bs{color:rgba(255,255,255,.85)}
.task{cursor:pointer;align-items:center}
#app.wide{max-width:1180px;padding-bottom:30px}
header.top.adm{background:var(--ink)}
.admm{padding:18px}
.admbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.kpis.k6{grid-template-columns:repeat(6,1fr)}
@media(max-width:820px){.kpis.k6{grid-template-columns:repeat(2,1fr)}.admg{grid-template-columns:1fr!important}}
.admg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ptab td,.ptab th{white-space:nowrap;padding:9px 8px}.ptab tbody tr:hover{background:#faf8f6}
.hb{display:flex;align-items:center;gap:10px;margin-bottom:10px}.hbl{width:96px;font-size:12.5px;flex:none}
.hbb{flex:1;display:flex;flex-direction:column;gap:3px}.hbb>div{display:flex;align-items:center;gap:6px;height:12px}
.hbb>div>span{display:block;height:10px;border-radius:0 4px 4px 0;min-width:2px}
.hbb em{font-style:normal;font-size:11.5px;color:var(--mut);font-family:"IBM Plex Mono",monospace}
.stk{display:flex!important;gap:2px;background:none!important}.stk span{display:block;height:10px}.stk span:last-child{border-radius:0 4px 4px 0}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}.acc{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px}
.demo{font-size:11px;background:#fff7d6;color:#6b5500;padding:6px 14px;text-align:center}
/* ===== v3 ===== */
body{font-size:15px}
header.appbar{position:sticky;top:0;z-index:8;background:rgba(243,241,238,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
header.appbar .meb{background:var(--red);color:#fff}
header.appbar .bt{flex:1;min-width:0}.btt{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bts{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{width:8px;height:8px;border-radius:50%;background:var(--grn);flex:none}.sync.off{background:#d9a23a}

.backb{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}

.btn.big{padding:15px 18px;font-size:16px;border-radius:14px}

.hi{font-size:22px;margin:4px 2px 12px}.hi b{font-weight:700}
.goal{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.gr{position:relative;width:84px;height:84px;flex:none}.ring{width:84px;height:84px}.ring circle{transition:stroke-dashoffset .8s ease}
.gp{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:17px}

.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.mini div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.mini b{display:block;font-size:17px}.mini span{font-size:12px;color:var(--mut)}
.nextc{background:var(--ink);color:#fff;border-radius:20px;padding:16px;margin-bottom:6px}
.nextc .nl{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.5px}.nextc .nn{font-size:20px;font-weight:700;margin-top:4px}
.nextc .meta .chip{background:rgba(255,255,255,.12);color:#fff}.nextc .meta .chip.c-red{background:#ffdad6;color:var(--red2)}.nextc .meta .chip.c-amb{background:#ffe9c2;color:#6b4000}.nextc .meta .chip.c-grn{background:#d4f0df;color:var(--grn)}
.nextc .btn.sec{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}
.nextc.done{background:var(--grnbg);color:var(--grn)}
.tasks{display:flex;flex-direction:column;gap:8px}
.task2{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;font:inherit;text-align:left;cursor:pointer;color:var(--mut);font-size:20px}
.task2 .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}.ti.red{background:var(--redbg)}.ti.amb{background:var(--ambbg)}.ti.blu{background:var(--blubg)}
.task2 .tx{flex:1;min-width:0;color:var(--ink);font-size:14px}.task2 .tx small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}

.eqr{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}.eqr>span:first-child{width:112px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.eqr .bar2{flex:1}.eqr b{width:86px;text-align:right;font-size:11.5px;flex:none}
.vsteps button small{display:block}
.mvl a{color:var(--blu);font-weight:600}
.testbar{background:#fff7d6;border-bottom:1px solid #f0dfaa;padding:8px 14px 2px;font-size:12.5px;color:#6b5500}.testbar .chips{margin-bottom:6px}.testbar .chips button{padding:6px 11px;font-size:13px}
.tdoc{font-size:12px}.tdh{display:flex;gap:10px;align-items:center;margin-bottom:8px}.tdh img{width:54px}.tdt{width:100%;border-collapse:collapse;font-size:11px}.tdt th,.tdt td{border:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:top}.tdt tr.warn td{background:#fff3e0}.tdsec{margin-top:8px;line-height:1.5}
.semh{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:8px}.semh>div{text-align:center;flex:1}
.semt{font-size:12px}.semt th.c{text-align:center;border-left:1px solid var(--line)}.semt tr.grp td{background:#efece8;font-weight:700;font-size:11.5px;letter-spacing:.3px}
.semt td{padding:5px 4px}.semin{width:52px;padding:5px 4px;text-align:right;font-size:13px;border-radius:8px}
#app.wide nav.tabs{max-width:1180px}#app.wide .semt td:first-child{min-width:230px}#app.wide .semt{font-size:12.5px}
.ctabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.ctabs button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 6px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;line-height:1.2}
.ctabs button span:first-child{font-size:20px}.ctabs button small{font-weight:400;color:var(--mut);font-size:11px}.ctabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.ctabs button.on small{color:rgba(255,255,255,.75)}
.cbad{display:inline-block;background:var(--red);color:#fff;border-radius:99px;font-size:10.5px;padding:1px 6px;margin-left:3px}
.pccrow{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:6px;background:#fff}.pccrow small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.pccrow.ok{background:#f3faf3;border-color:#cfe8cf}.pccrow.bad{background:#fff6f5;border-color:#f0c4c4}
.pccf{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}.pccf input[type=number]{width:110px}.pccf select{flex:1;min-width:160px}.pccf input:not([type]){flex:1;min-width:160px}
.pccbar{font-size:12.5px;margin:4px 0 8px}
.fab{position:fixed;z-index:7;right:max(14px,calc(50% - 216px));bottom:calc(74px + env(safe-area-inset-bottom));background:var(--red);color:#fff;border:0;border-radius:999px;padding:13px 18px 13px 16px;font:inherit;font-size:15px;font-weight:700;box-shadow:0 6px 18px rgba(217,31,27,.35),0 2px 4px rgba(0,0,0,.12);display:flex;align-items:center;gap:6px;cursor:pointer}
.fab:active{transform:scale(.96)}
main{padding-bottom:150px!important}
.task2.ld{width:100%}.task2.ld.off{opacity:.55;cursor:default}
.ppin{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.ppin label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mut,#666)}
.ppin input{width:74px;padding:8px;text-align:center}
.cprov{width:100%;margin:-2px 0 10px;padding:7px 10px;font-size:13px}

  if(isTripa(id)){const c=mpcOf(id);return [{n:"metros",f:1},c>0&&{n:"cajas",f:c}].filter(Boolean)}return null}
function fmtQ(id,q){const P=PRES(id);const it=itemOf(id);if(isTripa(id)){const c=mpcOf(id);return nf(q,0)+" m"+(c>0&&q>0?" · ≈ "+nf(q/c,1)+" cajas":"")}if(!P||P.length<2)return nf(q,dec(it.u))+" "+it.u;let r=Math.max(0,q);const big=P.slice().sort((a,b)=>b.f-a.f);const out=[];
  big.forEach((u,i)=>{const last=i===big.length-1;const k=last?Math.round(r/u.f):Math.floor(r/u.f+1e-9);if(k>0){out.push(nf(k,0)+" "+(k===1?({bultos:"bulto",cajas:"caja",metros:"metro",paquetes:"paquete",unidades:"unidad"}[u.n]||u.n):u.n));r-=k*u.f}});return (q<0?"−":"")+(out.join(" · ")||"0 "+it.u)}

/* ---------- movimientos, lotes y stock ---------- */
let _st=null,_stV=-1;
function stocks(){if(_stV===VER&&_st)return _st;const s={};live(DB.mov).forEach(m=>{s[m.item]=(s[m.item]||0)+(+m.q||0)});_st=s;_stV=VER;return s}
const stock = id => stocks()[id] || 0;
function addMov(item,q,tipo,ref,nota,lote,vence,extra){if(!q)return null;const m=Object.assign({id:uid(),ts:Date.now(),fecha:today(),item,q:Math.round(q*1000)/1000,tipo,ref:ref||"",nota:nota||"",lote:lote||"SIN-LOTE",vence:vence||null},extra||{});return put("mov",m)}
function lotsOf(item){const L={};live(DB.mov).filter(m=>m.item===item).forEach(m=>{const k=m.lote||"SIN-LOTE";const l=L[k]||(L[k]={lote:k,q:0,vence:null,f:m.fecha,ts:m.ts});l.q+=+m.q||0;if(m.q>0){if(m.vence&&!l.vence)l.vence=m.vence;if(m.ts<l.ts){l.ts=m.ts;l.f=m.fecha}}});
  return Object.values(L).filter(l=>l.q>1e-6).sort((a,b)=>(a.vence||"9999").localeCompare(b.vence||"9999")||a.ts-b.ts)}
function cuarentena(){if(cuarentena.v===VER&&cuarentena.c)return cuarentena.c;const q=new Set();
  live(DB.plan).forEach(p=>{if(p.est==="cerr"&&p.real&&!p.lib&&p.lote)live(DB.mov).forEach(m=>{if(m.tipo==="prod"&&m.lote===p.lote)q.add(m.item+"|"+m.lote)})});
  live(DB.oc).forEach(o=>{if(o.est==="rec")o.lines.forEach(l=>{if(l.qc==="mal"&&!l.lib&&!l.rech&&l.lote)q.add(l.mp+"|"+l.lote)})});
  cuarentena.v=VER;cuarentena.c=q;return q}
const libre = (item,l) => !cuarentena().has(item+"|"+l.lote);
const stockLibre = id => lotsOf(id).filter(l=>libre(id,l)).reduce((a,l)=>a+l.q,0) + Math.min(0,stock(id)-lotsOf(id).reduce((a,l)=>a+l.q,0));
function consumeFIFO(item,qty,tipo,ref,nota,extra){let rest=qty;const out=[];const solo=tipo==="desp"||tipo==="consumo";for(const l of lotsOf(item).filter(l=>!solo||libre(item,l))){if(rest<=1e-9)break;const t=Math.min(rest,l.q);addMov(item,-t,tipo,ref,nota,l.lote,l.vence,extra);out.push({lote:l.lote,q:t,vence:l.vence});rest-=t}
  if(rest>1e-9){addMov(item,-rest,tipo,ref,nota,"SIN-LOTE",null,extra);out.push({lote:"SIN-LOTE",q:rest})}return out}
const daysLeft = v => v ? diffD(v,today()) : null;
function porVencer(item){const it=itemOf(item);const lim=Math.max(3,Math.round((it.vida||90)*0.15));return lotsOf(item).filter(l=>l.vence&&daysLeft(l.vence)<=lim)}
function costF(fid){const f=F(fid);return Object.entries(f.lines).reduce((a,[m,q])=>a+q*(MP(m)?MP(m).cost:0),0)}
function costItem(id){if(id.startsWith("PT:")){const p=PT(id.slice(3));return p.f?costF(p.f)*p.kgu:(p.pk||p.p||0)*0.7*p.kgu}return MP(id).cost}

  live(DB.ped).forEach(o=>out.push({key:"MAN|"+o.id,id:o.id,cod:o.cod,vend:o.sim?o.origen+" · simulado":"Manual · "+(o.origen||"Planta"),cli:o.cli,date:o.date,entrega:o.entrega,items:o.items,st:"emitida",src:"man"}));

/* ---------- historia de ventas, colchón y verificación ---------- */
function historia(){
  if(historia.v===VER&&historia.c)return historia.c;const t=today(),desde=addD(t,-28);const ds=live(DB.mov).filter(m=>m.tipo==="desp"&&m.fecha>=desde&&m.item.startsWith("PT:"));
  const first=ds.reduce((a,m)=>m.fecha<a?m.fecha:a,t);let dias=0;for(let d=first;d<=t;d=addD(d,1)){const w=new Date(d+"T12:00:00").getDay();if(w>0&&w<6)dias++}
  const kg={};ds.forEach(m=>{const p=PT(m.item.slice(3));if(p&&p.f)kg[p.f]=(kg[p.f]||0)-m.q*p.kgu});
  const days=new Set(ds.map(m=>m.fecha)).size;const ok=days>=5;const avg={};Object.keys(kg).forEach(f=>avg[f]=kg[f]/Math.max(1,dias));
  historia.v=VER;historia.c={ok,days,avg};return historia.c}
function verif(){
  const dem=demandaSku(),ep=enPlanF(),H=historia(),rows={};
  DATA.PT.forEach(b=>{const p=PT(b.sku);if(!p.f)return;const r=rows[p.f]||(rows[p.f]={f:p.f,n:FD[p.f].n,fam:p.fam,dem:0,st:0,fijo:0,ep:ep[p.f]||0,skus:[]});
    r.dem+=(dem[p.sku]||0)*p.kgu;r.st+=Math.max(0,stock("PT:"+p.sku))*p.kgu;r.fijo+=(p.min||0)*p.kgu;r.skus.push(p.sku)});
  Object.values(rows).forEach(r=>{const a=H.avg[r.f]||0;r.avg=a;r.din=H.ok;r.min=H.ok?a*COBD():r.fijo;r.pron=H.ok?a*5:0;
    r.rate=H.ok?a:Math.max(r.dem/5,r.fijo/5);r.dias=r.rate?r.st/r.rate:99;r.prod=Math.max(0,r.dem+r.min-r.st-r.ep);r.prodSem=Math.max(0,Math.max(r.dem,r.pron)+r.min-r.st-r.ep);r.est=r.dem>r.st+r.ep+1e-6?"falta":r.prod>0?"colchon":"ok"});
  return Object.values(rows).sort((a,b)=>b.prod-a.prod||b.dem-a.dem);
}

function capEq(){const c={};EQ().forEach(e=>c[e.id]=e.kgh*e.h);return c}
function capInfo(lines){const L=carga(lines),C=capEq();let worst=null;EQ().forEach(e=>{const p=C[e.id]?L[e.id]/C[e.id]:0;if(!worst||p>worst.p)worst={id:e.id,n:e.n,p}});return{L,C,worst}}
function explode(lines){const req={};Object.entries(lines||{}).forEach(([fid,kg])=>{const f=F(fid);if(!f)return;Object.entries(f.lines).forEach(([m,c])=>req[m]=(req[m]||0)+c*(+kg||0))});return req}

  const v=verif().filter(r=>r.prodSem>0).sort((a,b)=>(b.est==="falta")-(a.est==="falta")||a.dias-b.dias||b.prodSem-a.prodSem);
  const days=lun?semDias(lun).filter(d=>d>today()):[1,2,3,4,5].map(n=>nextWork(today(),n));if(!days.length)return toast("Esa semana ya pasó");const C=capEq();const load=days.map(()=>({}));const lines=days.map(()=>({}));let fuera=0;

  days.forEach((d,i)=>{if(!Object.keys(lines[i]).length)return;const ex=planDe(d);const p0=ex&&ex.est==="borr"?ex:{id:uid(),num:ppNum(),fecha:d,lines:{},est:"borr",ts:Date.now()+i,sem,hist:[]};p0.lines={};p0.req={};Object.entries(lines[i]).forEach(([f,k])=>setF(p0,f,k));const p=put("plan",p0);if(!first)first=p.id;n++});
  UI.plan=first;track("plan_creado",{tipo:"semana",dias:n});commit();
  toast(n?`${n} ${n>1?"planes":"plan"} en borrador · primero lo que se agota (${dlab(days[0])} a ${dlab(days[days.length-1])})`+(fuera?` · ${nf(fuera,0)} kg no caben`:""):"No hace falta producir esta semana")}

function trazRows(p){const lote=p.lote;const cons=live(DB.mov).filter(m=>m.tipo==="consumo"&&m.ref===lote);const g={};

  const tripas=[...new Set(cons.filter(m=>/^T\d|^CEL|^MTB|^MPL/.test(m.item)).map(m=>MP(m.item).n))];const fe=p.emp?fcorta(iso(p.emp.ts)):"—";
  const order=["car","noc","emp","lim"];
  return Object.values(g).filter(r=>!DATA.BAGS.includes(r.item)&&r.item!=="ETI").sort((a,b)=>order.indexOf(MP(a.item).cat)-order.indexOf(MP(b.item).cat)).map(r=>{const m=MP(r.item);
    const rc=live(DB.mov).find(x=>x.tipo==="compra"&&x.item===r.item&&x.lote===r.lote);const oc=rc&&ocs().find(o=>o.num===rc.ref);
    const prods=Object.keys(p.lines).filter(f=>p.lines[f]>0&&F(f).lines[r.item]).map(f=>F(f).n);
    return {tipo:m.n,cat:m.cat,prov:oc?provName(oc.prov):(r.lote==="SIN-LOTE"?"Sin registro (faltó inventario)":/^INI|^AJ|^EJ/.test(r.lote)?"Inventario inicial":"—"),frec:rc?fcorta(rc.fecha):"—",lote:r.lote,q:r.q,u:m.u,prods,

function traza(q){const mv=live(DB.mov).filter(m=>m.lote===q);

  if(comp.length){const oc=ocs().find(o=>o.num===comp[0].ref);const cons=live(DB.mov).filter(m=>m.tipo==="consumo"&&m.lote===q);
    h+=`<div class="ocard"><div class="oh"><b>📥 Lote de proveedor ${esc(q)}</b><span class="chip">${fcorta(comp[0].fecha)}</span></div>
    <div class="ol">${comp.map(m=>`${esc(MP(m.item).n)} · +${nf(m.q,2)} ${MP(m.item).u}${m.vence?" · vence "+fcorta(m.vence):""}${m.qc?" · "+esc(m.qc):""}`).join("<br>")}</div>
    <div class="muted">${oc?esc(oc.num)+" · "+esc(provName(oc.prov)||"")+" · recibió "+esc(nameOf(oc.rec&&oc.rec.by)):""}</div></div>
    <div class="sec-t">➡️ Usado en los lotes</div><div class="card"><div class="mvl" style="border:0;margin:0">${cons.map(m=>`<div><span><a href="#" data-traz="${esc(m.ref)}">${esc(m.ref)}</a> · ${fcorta(m.fecha)}</span><b>${nf(-m.q,2)} ${MP(m.item).u}</b></div>`).join("")||`<div><span class="muted">Aún no se usa</span></div>`}</div></div>`}
  if(!h)h=`<div class="card"><div class="mvl" style="border:0;margin:0">${mv.map(m=>`<div><span>${fcorta(m.fecha)} · ${TIPOS[m.tipo]||m.tipo} · ${esc(itemOf(m.item).n)}</span><b>${nf(m.q,2)}</b></div>`).join("")}</div></div>`;

function loadOpts(k){const o=[];const ps=planes();const A=(i,t,s,at)=>o.push({i,t,s,at});const who=r=>holders(r).join(" · ")||"—";

  if(remote.epoch<DB.epoch){DIRTY=true;return false}

    Object.keys(DB[k]).forEach(id=>{if(!R[id]||(DB[k][id]._t||0)>(R[id]._t||0))DIRTY=true})});
  if((remote.cfg._t||0)>(DB.cfg._t||0)){DB.cfg=remote.cfg;ch=true}else if((DB.cfg._t||0)>(remote.cfg._t||0))DIRTY=true;
  return ch}

function syncLines(p){if(!p.req)return;const L={};Object.entries(p.lines||{}).forEach(([f,k])=>{if(!rowsOfF(f).length)L[f]=k});
  Object.entries(p.req).forEach(([id,v])=>{const r=SEMR[id];if(!r||!(v>0))return;const f=PTD[r.sku].f;L[f]=(L[f]||0)+v*kglOf(r)});

function setF(p,fid,kg){const rs=rowsOfF(fid);if(!rs.length){p.lines[fid]=Math.max(0,kg);return}p.req=p.req||{};rs.forEach(r=>{if(r!==rs[0])delete p.req[r.id]});const r=rs[0];p.req[r.id]=Math.max(0,Math.round(kg/kglOf(r)*100)/100);syncLines(p)}

function elabDia(p){const out={};if(!p||!p.real)return out;const R=p.real.f||{};

  return {prov:oc?(provName(oc.prov)||"Proveedor"):(lote==="SIN-LOTE"?"Sin registro":/^INI|^AJ|^EJ/.test(lote)?"Inv. inicial":"—"),f:rc?rc.fecha:null}}
function consumeFrom(item,qty,lote,tipo,ref){const out=[];let rest=qty;const l=lote&&lotsOf(item).find(x=>x.lote===lote);
  if(l&&l.q>0){const t=Math.min(rest,l.q);addMov(item,-t,tipo,ref,"",l.lote,l.vence);out.push({lote:l.lote,q:t});rest-=t}
  if(rest>1e-9)consumeFIFO(item,rest,tipo,ref).forEach(a=>out.push(a));return out}

/* ---------- producto en tránsito: elaborado que aún no está disponible ---------- */
function transito(){const rows=[];let kg=0;
  planes().forEach(p=>{let et=null,items=[];
    if(p.est==="proc"){et=[etapaProc(p),"c-amb"];items=Object.entries(p.lines).filter(([f,k])=>k>0).map(([f,k])=>({n:F(f).n,kg:+k}))}
    else if(p.est==="emp"){et=["Por empacar","c-blu"];items=Object.entries(p.real.f||{}).map(([f,x])=>({n:F(f).n,kg:x.horno||0}))}
    else if(p.est==="cerr"&&p.real&&!p.lib){et=p.ret?["Retenido por Calidad","c-red"]:["Por liberar (Calidad)","c-amb"];items=Object.entries(p.real.f||{}).map(([f,x])=>({n:F(f).n,kg:x.kg||0}))}
    if(!et)return;const t=items.reduce((a,i)=>a+i.kg,0);kg+=t;const h=(p.hist||[]).slice(-1)[0];rows.push({p,et,items,kg:t,desde:h?h.ts:p.ts})});
  return {n:rows.length,kg,rows}}
function transView(){const T=transito();const by=e=>T.rows.filter(r=>e==="En producción"?r.p.est==="proc":r.et[0].startsWith(e)).reduce((a,r)=>a+r.kg,0);
  const prods={};T.rows.forEach(r=>r.items.forEach(i=>{const x=prods[i.n]||(prods[i.n]={n:i.n,a:0,b:0,c:0});if(r.p.est==="proc")x.a+=i.kg;else if(r.p.est==="emp")x.b+=i.kg;else x.c+=i.kg}));
  const hrs=t=>{const h=(Date.now()-t)/36e5;return h<1?Math.round(h*60)+" min":h<48?nf(h,1)+" h":nf(h/24,1)+" días"};
  return `<div class="mini"><div><b>${nf(by("En producción"),0)}</b><span>kg en producción</span></div><div><b>${nf(by("Por empacar"),0)}</b><span>kg por empacar</span></div><div><b class="${by("Por liberar")+by("Retenido")?"neg":""}">${nf(by("Por liberar")+by("Retenido"),0)}</b><span>kg por liberar</span></div></div>
  <div class="alert blu"><span>⏳</span><div>Producto elaborado que todavía no se puede despachar: en producción, esperando empaque o en cuarentena hasta que Calidad lo libere.</div></div>
  ${Object.keys(prods).length?`<div class="card scroll" style="padding:8px 10px"><table class="xt"><thead><tr><th>Producto</th><th class="n">Producción</th><th class="n">Por empacar</th><th class="n">Por liberar</th><th class="n">Total kg</th></tr></thead><tbody>
   ${Object.values(prods).sort((a,b)=>(b.a+b.b+b.c)-(a.a+a.b+a.c)).map(x=>`<tr><td><b>${esc(x.n)}</b></td><td class="n">${x.a?nf(x.a,0):""}</td><td class="n">${x.b?nf(x.b,0):""}</td><td class="n">${x.c?nf(x.c,0):""}</td><td class="n"><b>${nf(x.a+x.b+x.c,0)}</b></td></tr>`).join("")}</tbody></table></div>`:""}
  ${T.rows.map(r=>`<div class="ocard"><div class="oh"><div><b>Lote ${esc(r.p.lote||r.p.num)}</b><div class="muted">${fcorta(r.p.fecha)} · hace ${hrs(r.desde)} en esta etapa</div></div><span class="chip ${r.et[1]}">${r.et[0]}</span></div>
    <div class="ol">${r.items.map(i=>`${esc(i.n)}: <b>${nf(i.kg,1)} kg</b>`).join("<br>")}</div>
    <div class="oa">${r.p.est==="proc"&&has("cap")?`<button class="btn sm" data-tab="prod">🏁 Ir a cerrar</button>`:r.p.est==="emp"&&has("empq")?`<button class="btn sm" data-act="emp" data-id="${r.p.id}">⚖️ Empacar</button>`:r.p.est==="cerr"&&has("cal")?`<button class="btn sm" data-tab="cal">🔬 Ir a Calidad</button>`:""}</div></div>`).join("")||`<div class="empty">No hay producto en tránsito.</div>`}`}

/* ---------- producto terminado en cava ---------- */
function cavaView(){const ed=has("almpt");const V={};verif().forEach(r=>V[r.f]=r);const fam=UI.sub.cavf||"todo";
  const rows=DATA.PT.map(b=>{const p=PT(b.sku);const id="PT:"+p.sku;const L=lotsOf(id);const lib=stockLibre(id);const tot=Math.max(0,stock(id));const cuar=Math.max(0,tot-lib);const pv=porVencer(id).length;
    const v=p.f&&V[p.f];const dias=v&&v.rate?v.st/v.rate:null;return{p,id,lib,cuar,pv,dias,prox:L.find(l=>l.vence)}}).filter(r=>r.lib||r.cuar||(r.p.min&&r.p.f)).filter(r=>fam==="todo"||r.p.fam===fam)
    .sort((a,b)=>(a.dias==null?99:a.dias)-(b.dias==null?99:b.dias));
  const kg=r=>r.lib*r.p.kgu;const tk=rows.reduce((a,r)=>a+kg(r),0),tq=rows.reduce((a,r)=>a+r.cuar*r.p.kgu,0);
  return `<div class="mini"><div><b>${nf(tk,0)}</b><span>kg disponibles</span></div><div><b class="${tq?"neg":""}">${nf(tq,0)}</b><span>kg en cuarentena</span></div><div><b class="${rows.some(r=>r.pv)?"neg":""}">${rows.reduce((a,r)=>a+r.pv,0)}</b><span>lotes por vencer</span></div></div>
  <div class="chips">${["todo",...FAMS_ALL].map(f=>`<button class="${f===fam?"on":""}" data-sub="cavf:${f}">${f==="todo"?"Todo":f}</button>`).join("")}</div>
  ${ed?`<button class="btn sec full" data-act="conteo" data-cat="pt">📋 Conteo físico de la cava</button>`:""}
  <div class="muted" style="margin:8px 2px">Ordenado por lo que se agota primero (días de cobertura según la venta).</div>
  ${rows.map(r=>`<button class="irow" data-item="${r.id}"><span class="dot ${r.dias!=null&&r.dias<2?"r":r.dias!=null&&r.dias<4||r.pv?"a":"g"}"></span><div class="main"><div class="nm">${esc(r.p.n)}${r.p.pres==="auto"?" (paq.)":""}</div><div class="meta">${esc(r.p.sku)}${r.dias!=null?` · <b>${r.dias<99?nf(r.dias,1)+" días":"sin venta"}</b> de cobertura`:""}${r.cuar?` · <span class="chip c-amb">🔬 ${nf(r.cuar,1)} ${r.p.u} en cuarentena</span>`:""}${r.prox?` · vence ${fcorta(r.prox.vence)}`:""}${r.pv?` <span class="chip c-red">⏳ por vencer</span>`:""}</div></div><div class="amt"><b>${nf(r.lib,dec(r.p.u))}</b>${r.p.u}</div></button>`).join("")||`<div class="empty">No hay producto en cava.</div>`}`}

/* ---------- prioridad: lo que se agota primero ---------- */
function agotarse(n){return verif().filter(r=>r.rate>0).sort((a,b)=>a.dias-b.dias).slice(0,n||8)}
function agotarsePanel(lun){const dias=semDias(lun);const ps=dias.map(planDe);const A=agotarse(8);if(!A.length)return "";
  const enSem=fid=>ps.reduce((a,p)=>a+(p&&p.lines?(+p.lines[fid]||0):0),0);
  return `<div class="card" style="padding:10px 12px;margin-bottom:10px"><b>🔥 Por agotarse · prioridad de la semana</b><div style="margin-top:6px">${A.map((r,i)=>{const pl=enSem(r.f);return `<div class="qrow"><div class="main"><b>${i+1}. ${esc(r.n)}</b><small>stock ${nf(r.st,0)} kg · vende ~${nf(r.rate,0)} kg/día${r.dem?" · pedido "+nf(r.dem,0)+" kg":""}</small></div><span class="chip ${r.dias<2?"c-red":r.dias<4?"c-amb":"c-grn"}">${r.dias<99?nf(r.dias,1)+" días":"—"}</span><span class="muted" style="width:92px;text-align:right">${pl?"en plan "+nf(pl,0)+" kg":"<b class='neg'>sin plan</b>"}</span></div>`}).join("")}</div></div>`}

/* ===================================================================== FLUJOGRAMA ESTRUCTURADO MEISTER (PCC)
   Hoja de proceso por lote: etapas III–XIII de embutidos y Día 1–5 de la línea de piezas. */
const PCCL = {
  emb:{n:"Línea de embutidos",st:[
    {k:"desc",n:"III · Descongelamiento",d:"En cava fría 0–5 °C, fuera de la zona de peligro (PCC 3)",sel:["En cava fría (0–5 °C)","No aplica: llegó refrigerada","Fuera de cava (no conforme)"],bad:"Fuera de cava (no conforme)",f:[{k:"t",n:"T cava °C",min:0,max:5,opt:1}],pcc:3},
    {k:"sel",n:"IV · Selección",d:"Inspección organoléptica; rechazo inmediato de lo fuera de especificación",chk:"Materia prima aprobada"},
    {k:"prep",n:"V · Preparación",d:"Deshuese, limpieza, recorte y troceado con la sala fría",chk:"Mesas y utensilios higienizados"},
    {k:"dos",n:"VI · Dosificación",d:"Pesaje exacto de carnes, condimentos, aditivos y sal de cura según la receta máster",chk:"Pesado según la receta"},
    {k:"mol",n:"VII · Molienda",d:"Molino Seydelmann · masa a 1–2 °C · disco y cuchillas afilados",f:[{k:"t",n:"T masa °C",max:2}],chk:"Disco y cuchillas OK"},
    {k:"cut",n:"VIII · Cúter",d:"La masa NO debe pasar de 3 °C",f:[{k:"t",n:"T masa °C",max:3}],pcc:"cúter"},
    {k:"llen",n:"IX · Llenado",d:"Embutido sin bolsas de aire",chk:"Sin bolsas de aire"},
    {k:"ata",n:"X · Atado",d:"Peso y longitud uniformes por pieza",chk:"Peso y longitud uniformes"},
    {k:"term",n:"XI · Tratamiento térmico",d:"Secado, ahumado y cocción · T interna mínima 70 °C (PCC 4)",f:[{k:"t",n:"T interna °C",min:70}],pcc:4,req:1},
    {k:"duch",n:"XII · Ducha de enfriamiento",d:"Choque térmico hasta 27 °C internos (PCC 5)",f:[{k:"t",n:"T interna °C",max:27}],pcc:5,req:1},
    {k:"cava",n:"XIII · Cava de enfriamiento 24 h",d:"Núcleo ≤ 6 °C después de 24 h (PCC 6)",f:[{k:"t",n:"T núcleo °C",max:6}],pcc:6,req:1,h24:1}]},
  pie:{n:"Línea de piezas (perniles, lomos cuadrados, tocineta)",st:[
    {k:"desc",n:"Día 1 · Descongelamiento controlado",d:"En cava de refrigeración 0–5 °C; control de tiempo y goteo",sel:["En cava fría (0–5 °C)","No aplica: llegó refrigerada","Fuera de cava (no conforme)"],bad:"Fuera de cava (no conforme)",f:[{k:"t",n:"T cava °C",min:0,max:5,opt:1}],pcc:3},
    {k:"desp",n:"Día 2 · Desposte, limpieza y formado",d:"Deshuese, retiro de grasa y pulido según el producto",f:[{k:"kg",n:"Peso limpio kg"}],chk:"Mesas y cuchillos higienizados"},
    {k:"iny",n:"Día 3 · Inyección y marinado",d:"Salmuera < 4 °C · % de inyección = peso final vs. inicial",f:[{k:"kg0",n:"Peso antes kg"},{k:"kg1",n:"Peso después kg"},{k:"t",n:"T salmuera °C",max:4}]},
    {k:"term",n:"Día 4 · Cocción y ahumado",d:"T interna 70–72 °C en el centro de la pieza más grande (PCC)",f:[{k:"t",n:"T interna °C",min:70}],pcc:4,req:1},
    {k:"duch",n:"Día 5 · Ducha de enfriamiento",d:"Choque térmico hasta 27 °C internos",f:[{k:"t",n:"T interna °C",max:27}],pcc:5,req:1},
    {k:"cava",n:"Día 5+ · Cava de estabilización 24 h",d:"Núcleo ≤ 6 °C antes de empacar",f:[{k:"t",n:"T núcleo °C",max:6}],pcc:6,req:1,h24:1}]},
  fre:{n:"Frescos",st:[
    {k:"prep",n:"Preparación y corte",d:"Sala fría, utensilios higienizados",chk:"Higiene OK"},
    {k:"cava",n:"Cava de producto",d:"≤ 5 °C",f:[{k:"t",n:"T cava °C",max:5}]}]}
};
const lineaDe = fam => fam==="Jamones"||fam==="Ahumados" ? "pie" : fam==="Frescos" ? "fre" : "emb";
const lineasPlan = p => [...new Set(Object.keys(p.lines||{}).filter(f=>p.lines[f]>0&&FD[f]).map(f=>lineaDe(FD[f].fam)))].sort((a,b)=>"embpiefre".indexOf(a)-"embpiefre".indexOf(b));
function pccVal(st,r){if(!r)return null;let ok=true;(st.f||[]).forEach(x=>{const v=r.v&&r.v[x.k];if(v==null)return;if(x.min!=null&&v<x.min)ok=false;if(x.max!=null&&v>x.max)ok=false});if(st.bad&&r.sel===st.bad)ok=false;if(st.chk&&r.chk===false)ok=false;return ok}
function pccEstado(p){const L=lineasPlan(p);let n=0,d=0,bad=0,falta=[];L.forEach(l=>PCCL[l].st.forEach(st=>{n++;const r=((p.pcc||{})[l]||{})[st.k];if(r){d++;if(!pccVal(st,r))bad++}else if(st.req)falta.push(PCCL[l].st.length>3?st.n:st.n)}));return{n,d,bad,falta,L}}
function etapaProc(p){const L=lineasPlan(p);const has_=k=>L.every(l=>!PCCL[l].st.some(s=>s.k===k)||((p.pcc||{})[l]||{})[k]);if(L.length&&has_("cava"))return"Listo para empaque";if(L.some(l=>((p.pcc||{})[l]||{}).duch||((p.pcc||{})[l]||{}).term))return"Enfriamiento (ducha y cava 24 h)";if(L.some(l=>Object.keys((p.pcc||{})[l]||{}).length))return"Elaboración";return"Por arrancar"}
function pccSheet(id){const p=DB.plan[id];const ed=has("cap")||has("cal");const L=lineasPlan(p);
  openModal(`<div class="grab"></div><h3>📋 Hoja de proceso · Lote ${esc(p.lote||p.num)}</h3><div class="muted">Según el Flujograma estructurado Meister. Registra cada etapa al terminarla. Si un valor sale del límite, anota la acción correctiva. Escribe quién hizo cada etapa.</div>${opsList()}
  ${L.map(l=>`<div class="sec-t">${esc(PCCL[l].n)}</div>${PCCL[l].st.map(st=>{const r=((p.pcc||{})[l]||{})[st.k];const ok=pccVal(st,r);
    if(r)return `<div class="pccrow ${ok?"ok":"bad"}"><div class="main"><b>${ok?"✓":"✗"} ${esc(st.n)}</b>${st.pcc?` <span class="chip ${ok?"c-grn":"c-red"}">${typeof st.pcc==="number"?"PCC "+st.pcc:"Control crítico"}</span>`:""}<small>${[r.sel,(st.f||[]).filter(x=>r.v&&r.v[x.k]!=null).map(x=>x.n.replace(" °C","")+": "+fx(r.v[x.k])+(x.k==="t"?" °C":"")).join(" · "),r.v&&r.v.kg0&&r.v.kg1?"inyección "+pct(r.v.kg1/r.v.kg0-1):"",r.acc?"Acción: "+r.acc:""].filter(Boolean).map(esc).join(" · ")} · ${hhmm(r.ts)} ${dlab(iso(r.ts))} · ${esc(quien(r))}</small></div></div>`;
    return `<div class="pccrow"><div class="main"><b>${esc(st.n)}</b>${st.pcc?` <span class="chip c-amb">${typeof st.pcc==="number"?"PCC "+st.pcc:"Control crítico"}</span>`:""}${st.req?` <span class="chip">obligatorio</span>`:""}<small>${esc(st.d)}</small>
      ${ed?`<div class="pccf">${st.sel?`<select data-pcs="${l}|${st.k}">${st.sel.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`:""}${(st.f||[]).map(x=>`<input type="number" step="0.1" inputmode="decimal" placeholder="${esc(x.n)}" data-pcf="${l}|${st.k}|${x.k}">`).join("")}${st.chk?`<label class="chk" style="border:0;padding:4px 0"><input type="checkbox" data-pcc="${l}|${st.k}" checked> ${esc(st.chk)}</label>`:""}
      <input list="opsl" placeholder="¿Quién la hizo? (operario)" value="${esc(lastOp(l+"|"+st.k))}" data-pco="${l}|${st.k}"><input placeholder="Acción correctiva (si algo no cumple)" data-pca="${l}|${st.k}"><button class="btn sm" data-act="pccsave" data-id="${id}" data-k="${l}|${st.k}">Registrar</button></div>`:""}</div></div>`}).join("")}`).join("")}`)}
/* temperatura de cavas (PCC 2 y PCC 7) */
const CAVAS=[{k:"mpr",n:"Cava MP refrigerada",max:5},{k:"mpc",n:"Cava de congelación",max:-18},{k:"enf",n:"Cava de enfriamiento",max:6},{k:"ptc",n:"Cava de producto terminado",max:5}];
function cavasView(){const t=today();const r=DB.cav[t];const ed=has("cal")||has("almmp")||has("almpt");const hist=live(DB.cav).sort((a,b)=>b.id.localeCompare(a.id)).slice(0,10);
  const bad=x=>{const c=CAVAS.find(c=>c.k===x.k);return c&&x.t>c.max};
  return `<div class="ref">PCC 2 y PCC 7: refrigeración &lt; 5 °C, congelación ≤ −18 °C, enfriamiento ≤ 6 °C, producto terminado ≤ 5 °C. Registra mañana y tarde.</div>
  ${ed?`<div class="card">${CAVAS.map(c=>`<div class="qrow"><div class="main">${esc(c.n)}<small>límite ${c.max<0?"≤ ":"≤ "}${fx(c.max)} °C</small></div><input type="number" step="0.1" inputmode="decimal" data-cav="${c.k}" placeholder="°C" style="width:84px"></div>`).join("")}<button class="btn full" style="margin-top:8px" data-act="cavsave">🌡️ Registrar temperaturas</button></div>`:""}
  <div class="sec-t">Hoy</div>${r&&r.l.length?`<div class="card">${r.l.slice().reverse().map(x=>`<div class="qrow"><div class="main">${esc(CAVAS.find(c=>c.k===x.k).n)}<small>${hhmm(x.ts)} · ${esc(nameOf(x.by))}</small></div><b class="mono ${bad(x)?"neg":"pos"}">${fx(x.t)} °C</b></div>`).join("")}</div>`:`<div class="empty">Sin registros hoy.</div>`}
  ${hist.filter(h=>h.id!==t).map(h=>{const n=h.l.filter(bad).length;return `<div class="irow" style="cursor:default"><span class="dot ${n?"r":"g"}"></span><div class="main"><div class="nm">${dlab(h.id)}</div><div class="meta">${h.l.length} lecturas</div></div><div class="amt"><b class="${n?"neg":"pos"}">${n}</b>fuera</div></div>`}).join("")}`}
function piezasAgenda(p){const L=lineasPlan(p);if(!L.includes("pie"))return "";const back=n=>{let x=p.fecha,k=0;while(k<n){x=addD(x,-1);const w=new Date(x+"T12:00:00").getDay();if(w>0&&w<6)k++}return x};
  return `<div class="alert amb"><span>🥩</span><div><b>Línea de piezas:</b> descongelar el ${dlab(back(3))}, desposte el ${dlab(back(2))}, inyección el ${dlab(back(1))} y cocción el ${dlab(p.fecha)}. El lote se inicia el día de descongelar.</div></div>`}
/* sin señal: guarda la app en el teléfono */
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
