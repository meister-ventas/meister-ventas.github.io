<style>
:root{
  --bg:#f3f1ee;--card:#fff;--ink:#1d1b1a;--mut:#6d6863;--line:#e4e0db;
  --red:#d91f1b;--red2:#a3150f;--redbg:#fdecea;--brn:#7b684d;--brnbg:#f1ece4;
  --amb:#a86200;--ambbg:#fff3df;--grn:#1d7a46;--grnbg:#e5f4ec;--blu:#245f9e;--blubg:#e6eff9;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#dcd8d3;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
#app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px;box-shadow:0 0 40px rgba(0,0,0,.08)}
header.top{background:var(--red);color:#fff;padding:16px 18px 14px;position:sticky;top:0;z-index:5}
header.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px}
header.top .sub{font-size:12.5px;opacity:.85;margin-top:2px}
header.top select{max-width:170px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
header.top select option{color:#000}
.back{background:none;border:0;color:#fff;font-size:22px;padding:0 8px 0 0;cursor:pointer;line-height:1}
main{padding:14px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:18px;font-weight:600;margin-top:3px}
.list .it{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.it .main{flex:1;min-width:0}
.it .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .meta{font-size:12px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.it .amt{text-align:right;font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:500;padding:2px 7px;border-radius:99px;background:#eee;color:#444;white-space:nowrap}
.c-red{background:var(--redbg);color:var(--red)}.c-amb{background:var(--ambbg);color:var(--amb)}.c-grn{background:var(--grnbg);color:var(--grn)}.c-blu{background:var(--blubg);color:var(--blu)}
.num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#efece8;font-weight:600;font-size:13px;flex:none}
.num.done{background:var(--grnbg);color:var(--grn)}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:10px 0 12px;font:inherit;font-size:11.5px;color:var(--mut);cursor:pointer;position:relative}
nav.tabs button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
nav.tabs button.on{color:var(--red);font-weight:600}
.badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;border-radius:99px;padding:1px 5px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;background:var(--red);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--red);padding:6px 8px}
.btn.sm{padding:7px 10px;font-size:12.5px;border-radius:8px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.steps{display:flex;gap:4px;padding:10px 14px 0;overflow-x:auto;scrollbar-width:none}
.steps button{flex:none;border:0;background:#e9e6e2;color:var(--mut);border-radius:99px;font:inherit;font-size:12px;padding:6px 10px;cursor:pointer}
.steps button.on{background:var(--ink);color:#fff}
.steps button.ok{background:var(--grnbg);color:var(--grn)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--mut);font-weight:500;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.3px}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
input,select,textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:#fff;color:var(--ink);width:100%}
input.q{width:58px;text-align:center;padding:6px 4px}
label.f{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk:last-child{border-bottom:0}
.chk input[type=checkbox]{width:20px;height:20px;accent-color:var(--grn);flex:none}
.alert{border-radius:12px;padding:11px 12px;font-size:13px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.alert.red{background:var(--redbg);color:var(--red2)}.alert.amb{background:var(--ambbg);color:#7a4700}.alert.grn{background:var(--grnbg);color:var(--grn)}.alert.blu{background:var(--blubg);color:var(--blu)}
.alert b{font-weight:600}
.tot{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0}
.tot.big{font-size:17px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.foot{position:sticky;bottom:72px;padding:10px 0 0;display:flex;gap:8px}
.inv-doc{border:1px dashed #cfc9c2;border-radius:10px;padding:14px;background:#fffdfa}
.inv-doc .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.bar{height:10px;border-radius:5px;background:#eee;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--mut);margin-top:8px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.seg{display:flex;background:#e9e6e2;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.modal{position:fixed;inset:0;background:rgba(20,15,10,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:16px}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:30;max-width:90%;text-align:center}
.muted{color:var(--mut);font-size:12.5px}
.sec-t{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 8px}
.photo{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:8px}
pre.rep{white-space:pre-wrap;font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:#f6f4f1;border-radius:10px;padding:10px;margin:0;max-height:260px;overflow:auto}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.pipe button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 6px;text-align:left;font:inherit;cursor:pointer}
.pipe button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pipe .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut)}
.pipe .v{font-size:18px;font-weight:600}.pipe .m{font-size:11px;color:var(--mut)}
.dots{display:flex;gap:3px;margin-top:5px}.dots i{width:16px;height:4px;border-radius:2px;background:#e4e0db}.dots i.on{background:var(--ink)}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{display:flex;gap:10px;padding:0 0 14px;position:relative;font-size:13.5px}
.tl li:before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl .d{width:18px;height:18px;border-radius:50%;border:2px solid #cfc9c2;background:#fff;flex:none;z-index:1}
.tl li.on .d{background:var(--grn);border-color:var(--grn)}
.tl li.cur .d{background:#fff;border-color:var(--ink);box-shadow:0 0 0 3px #e9e6e2}
.sel{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.sel.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:#fffafa}
.bell{position:relative;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;width:34px;height:32px;display:grid;place-items:center;cursor:pointer;flex:none}
.bell .badge{top:-6px;left:auto;right:-6px}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 20px 40px;background:var(--bg)}
.brand{font-weight:700;letter-spacing:3px;color:var(--red);font-size:22px;margin:18px 0 26px;text-align:center}
.brand span{display:block;font-size:12px;letter-spacing:4px;color:var(--mut);font-weight:500;margin-top:2px;text-transform:uppercase}
.login h2{font-size:22px;margin:6px 0 10px;text-align:center}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.who button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 10px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
.who button:active{transform:scale(.98)}
.av{width:44px;height:44px;border-radius:50%;background:var(--redbg);color:var(--red);display:inline-grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.av.big{width:72px;height:72px;font-size:24px;margin:10px auto 8px}.av.adm{background:var(--ink);color:#fff}
.av.sm{width:28px;height:28px;font-size:11px;margin-right:8px;vertical-align:middle}
.dotsp{display:flex;gap:16px;justify-content:center;margin:8px 0}.dotsp i{width:16px;height:16px;border-radius:50%;border:2px solid #b9b2aa}.dotsp i.on{background:var(--red);border-color:var(--red)}
.perr{color:var(--red);font-size:14px;height:22px;text-align:center;font-weight:500}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:8px}
.pad button{height:76px;border-radius:50%;border:0;background:#fff;font:inherit;font-size:26px;font-weight:500;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);color:var(--ink)}
.pad button:active{background:#eee}
.meb{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--red);border:0;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.hello{background:var(--red);color:#fff;border-radius:18px;padding:16px 16px 14px;margin-bottom:14px}
.hello .hn{font-size:26px;font-weight:700;margin:2px 0 12px}
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hs div{background:rgba(255,255,255,.13);border-radius:12px;padding:9px}
.hs b{display:block;font-size:16px}.hs span{font-size:11.5px;opacity:.85}
.bigg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigb{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--ink);min-height:118px}
.bigb .bi{width:40px;height:40px;border-radius:12px;background:#f1eeea;display:grid;place-items:center;margin-bottom:6px}.bigb .bi svg{width:22px;height:22px}
.bigb .bl{font-size:16px;font-weight:600}.bigb .bs{font-size:12.5px;color:var(--mut)}
.bigb.pri{background:var(--red);color:#fff;border-color:var(--red)}.bigb.pri .bi{background:rgba(255,255,255,.18)}.bigb.pri .bs{color:rgba(255,255,255,.85)}
.task{cursor:pointer;align-items:center}
#app.wide{max-width:1180px;padding-bottom:30px}
header.top.adm{background:var(--ink)}
.admm{padding:18px}
.admbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.kpis.k6{grid-template-columns:repeat(6,1fr)}
@media(max-width:820px){.kpis.k6{grid-template-columns:repeat(2,1fr)}.admg{grid-template-columns:1fr!important}}
.admg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ptab td,.ptab th{white-space:nowrap;padding:9px 8px}.ptab tbody tr:hover{background:#faf8f6}
.hb{display:flex;align-items:center;gap:10px;margin-bottom:10px}.hbl{width:96px;font-size:12.5px;flex:none}
.hbb{flex:1;display:flex;flex-direction:column;gap:3px}.hbb>div{display:flex;align-items:center;gap:6px;height:12px}
.hbb>div>span{display:block;height:10px;border-radius:0 4px 4px 0;min-width:2px}
.hbb em{font-style:normal;font-size:11.5px;color:var(--mut);font-family:"IBM Plex Mono",monospace}
.stk{display:flex!important;gap:2px;background:none!important}.stk span{display:block;height:10px}.stk span:last-child{border-radius:0 4px 4px 0}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}.acc{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px}
.demo{font-size:11px;background:#fff7d6;color:#6b5500;padding:6px 14px;text-align:center}
/* ===== v3 ===== */
body{font-size:15px}
header.appbar{position:sticky;top:0;z-index:8;background:rgba(243,241,238,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
header.appbar .meb{background:var(--red);color:#fff}
header.appbar .bt{flex:1;min-width:0}.btt{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bts{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{width:8px;height:8px;border-radius:50%;background:var(--grn);flex:none}.sync.off{background:#d9a23a}
.bell2{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.bell2 .badge{top:-5px;left:auto;right:-5px}
.backb{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
nav.tabs{align-items:flex-end}
nav.tabs .fab{position:relative;color:var(--red);font-weight:600}
nav.tabs .fab span{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;margin:-26px auto 4px;box-shadow:0 6px 16px rgba(179,38,30,.35);border:4px solid #fff}
nav.tabs .fab span svg{width:26px;height:26px;margin:0}
.btn.big{padding:15px 18px;font-size:16px;border-radius:14px}
.btn.big.ghost{color:var(--mut)}
.hi{font-size:22px;margin:4px 2px 12px}.hi b{font-weight:700}
.goal{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.gr{position:relative;width:84px;height:84px;flex:none}.ring{width:84px;height:84px}.ring circle{transition:stroke-dashoffset .8s ease}
.gp{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:17px}
.gl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}.gv{font-size:24px;font-weight:700;margin:2px 0}.gv span{font-size:14px;color:var(--mut);font-weight:500}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.mini div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.mini b{display:block;font-size:17px}.mini span{font-size:12px;color:var(--mut)}
.nextc{background:var(--ink);color:#fff;border-radius:20px;padding:16px;margin-bottom:6px}
.nextc .nl{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.5px}.nextc .nn{font-size:20px;font-weight:700;margin-top:4px}
.nextc .meta .chip{background:rgba(255,255,255,.12);color:#fff}.nextc .meta .chip.c-red{background:#ffdad6;color:var(--red2)}.nextc .meta .chip.c-amb{background:#ffe9c2;color:#6b4000}.nextc .meta .chip.c-grn{background:#d4f0df;color:var(--grn)}
.nextc .btn.sec{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}
.nextc.done{background:var(--grnbg);color:var(--grn)}
.tasks{display:flex;flex-direction:column;gap:8px}
.task2{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;font:inherit;text-align:left;cursor:pointer;color:var(--mut);font-size:20px}

/* historial demo de los 5 días hábiles previos para que el reporte semanal tenga datos */
function makeHist(v){
  const r=rnd(hash(v));const out=[];const cl=SEED[v];
  for(let i=1;i<=6;i++){const d=addD(today,-i);if(d.getDay()===0)continue;
    const nv=4+Math.floor(r()*5);let venta=0,un=0,cob=0,ret=0,dev=0,ped=0;
    for(let k=0;k<nv;k++){if(r()<.7){ped++;const u=10+Math.floor(r()*40);un+=u;venta+=u*(5+r()*4)}
      if(r()<.5){const c=40+r()*400;cob+=c;if(r()<.6)ret+=c*.16/1.16*.75}if(r()<.2)dev+=1+Math.floor(r()*4)}
    out.push({date:iso(d),visitas:nv,pedidos:ped,venta,un,cob,ret,dev,kg:Math.round(venta/9)})}
  return out}

function allClients(st){st=st||S;const c=_CC.get(st);const n=st.newClients.length;if(c&&c.n===n&&c.v===st.vend)return c;
  const base=SEED[st.vend].concat(st.newClients);const seen=new Set(base.map(x=>x.cod));const list=base.concat(masterClients().filter(m=>!seen.has(m.cod)));

  return base.concat(extra).map(f=>{
    const ps=S.payments.filter(p=>p.fac===f.n&&p.cod===c.cod&&p.ver!=="rech");const paid=ps.reduce((a,p)=>a+p.monto+p.ret,0);const pend=ps.filter(p=>p.ver==="pend").reduce((a,p)=>a+p.monto+p.ret,0);
    const dv=days(today,pd(f.v));

  st.orders.sort((a,b)=>b.hist.emitida-a.hist.emitida)}

function syncPaid(){S.orders.forEach(o=>{if(!o.hist.cobrada){const c=cli(o.cod);if(c&&!invoices(c).some(f=>f.n===o.fac))o.hist.cobrada=Date.now()}})}
function ordText(o){const c=cli(o.cod);return `MEISTER · Orden ${o.id} (${STATUS[sIdx(o)][1]})\nVendedor: ${o.vend}\nCliente: ${c.nombre} (${c.cod})\nPDV: ${o.pdv.nombre}${o.pdv.dir?" · "+o.pdv.dir:""}\nEntrega: ${o.entrega?fdmy(new Date(o.entrega+"T00:00")):"-"}\n\n`+o.items.map(i=>`${i.q} x ${CAT.find(p=>p.sku===i.sku).n} = ${usd(i.q*i.p)}`).join("\n")+`\n\nSubtotal ${usd(o.sub)}\nIVA ${usd(o.iva)}\nTotal ${usd(o.tot)}\nFactura ${o.fac} · vence ${o.venc}`+(o.obs?`\nObs: ${o.obs}`:"")}

/* ---------- render ---------- */
function render(){
  const a=$("#app");a.className=SES&&SES.role==="admin"?"wide":"";
  if(!SES){a.innerHTML=loginView();if(UI.modal)a.insertAdjacentHTML("beforeend",UI.modal.html);return}
  if(SES.role==="admin"){a.innerHTML=adminView();if(UI.modal)a.insertAdjacentHTML("beforeend",UI.modal.html);return}
  if(UI.visit){a.innerHTML=visitView();bindVisit()}
  else a.innerHTML=shell(({home,ruta,venta:nuevaVenta,ord:ordenes,cob:cobranza,ale:alertas,rep:reportes})[UI.tab]());
  if(UI.modal)a.insertAdjacentHTML("beforeend",UI.modal.html);
}
function shell(body){
  const nAle=alertList().length;
  const ic={ruta:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
   cob:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
   ale:'<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/>',
   rep:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
   home:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',
   venta:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
   ord:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'};
  const tb=(k,l)=>`<button data-tab="${k}" class="${UI.tab===k?"on":""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic[k]}</svg>${l}</button>`;
  return `<div class="demo">Prototipo · CxC real al ${fdmy(today)} · catálogo e inventario de ejemplo</div>
  <header class="top"><div class="row"><div><h1>Meister Ventas</h1><div class="sub">${today.toLocaleDateString("es-VE",{weekday:"long",day:"numeric",month:"long"})} · Tasa BCV ${S.tasa.toLocaleString("es-VE")}</div></div>
  <div style="display:flex;gap:8px;align-items:center">
  <button class="bell" data-tab="ale" aria-label="Alertas"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>${nAle?`<span class="badge">${nAle}</span>`:""}</button><button class="meb" data-act="me" aria-label="Mi perfil">${ini(S.vend)}</button></div></div></header>
  <main>${body}</main>
  <nav class="tabs">${tb("home","Inicio")}${tb("ruta","Ruta")}${tb("venta","Vender")}${tb("ord","Órdenes")}${tb("cob","Cobrar")}</nav>`}

function dayStats(){
  const vs=S.visits.filter(v=>v.date===TODAY);const ps=S.payments.filter(p=>p.date===TODAY);
  const os=S.orders.filter(o=>o.date===TODAY);
  return{visitas:vs.filter(v=>v.closed).length,pedidos:os.length,venta:os.reduce((a,o)=>a+o.sub,0),
   un:os.reduce((a,o)=>a+o.items.reduce((x,i)=>x+i.q,0),0),os,cob:ps.reduce((a,p)=>a+p.monto,0),ret:ps.reduce((a,p)=>a+p.ret,0),
   dev:vs.reduce((a,v)=>a+v.returns.reduce((x,r)=>x+r.q,0),0),devUsd:vs.reduce((a,v)=>a+v.returns.reduce((x,r)=>x+r.q*CAT.find(p=>p.sku===r.sku).p,0),0),vs,ps}}

function ruta(){
  const st=dayStats();const cl=clients();
  return `<div class="kpis"><div class="kpi"><div class="l">Visitas</div><div class="v">${st.visitas}/${cl.length}</div></div>
  <div class="kpi"><div class="l">Pedidos</div><div class="v">${usd(st.venta)}</div></div>
  <div class="kpi"><div class="l">Cobrado</div><div class="v">${usd(st.cob)}</div></div></div>
  <div class="card"><h3>Ruta de hoy</h3><div class="list">${cl.map((c,i)=>{
    const v=visitOf(c.cod);const b=cxc(c);const venc=b[1]+b[2]+b[3]+b[4];const tot=b.reduce((a,x)=>a+x,0);
    return `<div class="it" data-open="${c.cod}"><div class="num ${v&&v.closed?"done":""}">${v&&v.closed?"✓":i+1}</div>
    <div class="main"><div class="nm">${esc(c.nombre)}</div><div class="meta"><span class="mono" style="font-size:11px">${c.cod}</span>${c.esp?'<span class="chip c-blu">Contrib. especial</span>':""}<span class="chip">Crédito ${c.cred}d</span>${b[4]>0?'<span class="chip c-red">Vencido &gt;22d</span>':venc>0?'<span class="chip c-amb">Con vencido</span>':""}${v&&v.invoice?`<span class="chip c-grn">Pedido ${usd(v.invoice.tot)}</span>`:""}</div></div>
    <div class="amt"><div class="mono">${usd(tot)}</div><div class="muted">${venc>0?"venc. "+usd(venc):"al día"}</div></div></div>`}).join("")}</div></div>
`}

/* ---------- visita ---------- */
const STEPS=["Llegada","Inventario","Chequeo","Devoluciones","Pedido","Factura","Cobranza"];
function startVisit(cod){
  let v=visitOf(cod);
  if(!v){const c=cli(cod);v={id:Date.now(),date:TODAY,cod,checkin:null,checkout:null,closed:false,stock:stock(c),check:{exh:false,precio:false,frio:false,fifo:false,pop:false,temp:"",pvp:"",obs:"",foto:null},returns:[],order:[],invoice:null};
    v.order=v.stock.map(s=>{const p=CAT.find(x=>x.sku===s.sku);return{sku:s.sku,q:Math.max(0,p.par-s.ex)}}).filter(o=>o.q>0);
    S.visits.push(v);save()}
  UI.visit=cod;UI.step=v.closed?6:v.checkin?1:0;render();window.scrollTo(0,0)}
function curV(){return visitOf(UI.visit)}
function visitView(){
  const c=cli(UI.visit),v=curV();
  const done=[!!v.checkin,v.stepInv,v.stepChk,v.stepDev,!!v.invoice||v.noOrder,!!v.invoice||v.noOrder,v.closed];
  return `<header class="top"><div class="row"><div style="display:flex;align-items:center"><button class="back" data-act="close">‹</button><div><h1 style="font-size:15px">${esc(c.nombre)}</h1><div class="sub">${c.cod} · Crédito ${c.cred} días${c.esp?" · Contribuyente especial":""}</div></div></div></div></header>
  <div class="steps">${STEPS.map((s,i)=>`<button data-step="${i}" class="${UI.step===i?"on":done[i]?"ok":""}">${i+1}. ${s}</button>`).join("")}</div>
  <main>${[stepLlegada,stepInv,stepChk,stepDev,stepPed,stepFac,stepCob][UI.step](c,v)}</main>`}

function stepLlegada(c,v){
  const b=cxc(c);const venc=b[1]+b[2]+b[3]+b[4];const al=stockAlerts(v);
  return `<div class="card"><h3>Registro de visita</h3>
  ${v.checkin?`<div class="alert grn">✓ <div>Llegada registrada a las <b>${hhmm(v.checkin)}</b></div></div>`:`<p class="muted" style="margin-top:0">Marque la llegada al llegar al punto de venta. En la app real se guarda la ubicación GPS.</p><button class="btn full" data-act="checkin">Marcar llegada</button>`}</div>
  <div class="card"><h3>Antes de entrar</h3>
  ${venc>0?`<div class="alert ${b[4]>0?"red":"amb"}">⚠ <div>Tiene <b>${usd(venc)}</b> vencido${b[4]>0?`, de ello <b>${usd(b[4])}</b> con más de 22 días`:""}. Gestione cobranza en esta visita.</div></div>`:`<div class="alert grn">✓ <div>Cliente al día en sus pagos.</div></div>`}
  ${c.esp?`<div class="alert blu">ℹ <div>Contribuyente especial: retiene <b>${S.retPct}% del IVA</b>. Solicite el comprobante de retención al cobrar.</div></div>`:""}
  ${al.length?`<div class="alert amb">⚠ <div>Se esperan <b>${al.length}</b> producto(s) vencidos o por vencer en anaquel. Revíselos en Inventario.</div></div>`:""}
  </div>${v.checkin?`<button class="btn full" data-step="1">Continuar a inventario ›</button>`:""}`}

function stockAlerts(v){return v.stock.filter(s=>s.ex>0&&days(new Date(s.venc+"T00:00"),today)<=7)}
function stepInv(c,v){
  return `<div class="card"><h3>Inventario en anaquel</h3><p class="muted" style="margin-top:0">Cuente existencias y anote el vencimiento del lote más viejo. El pedido sugerido se calcula con el nivel ideal (par).</p>
  <table><thead><tr><th>Producto</th><th class="r">Exist.</th><th class="r">Vence</th></tr></thead><tbody>
  ${v.stock.map((s,i)=>{const p=CAT.find(x=>x.sku===s.sku);const dd=days(new Date(s.venc+"T00:00"),today);
  const tag=s.ex>0&&dd<0?'<span class="chip c-red">Vencido</span>':s.ex>0&&dd<=7?`<span class="chip c-amb">${dd}d</span>`:"";
  return `<tr><td><div style="font-weight:500">${p.n}</div><div class="muted">Par ${p.par} · ${tag}</div></td>
  <td class="r"><input class="q" type="number" min="0" inputmode="numeric" data-ex="${i}" value="${s.ex}"></td>
  <td class="r"><input type="date" data-vc="${i}" value="${s.venc}" style="width:128px;padding:6px;font-size:12.5px"></td></tr>`}).join("")}
  </tbody></table></div><button class="btn full" data-act="invok">Guardar inventario ›</button>`}

function stepChk(c,v){const k=v.check;const t=parseFloat(k.temp);
  const it=(f,l)=>`<label class="chk"><input type="checkbox" data-ck="${f}" ${k[f]?"checked":""}>${l}</label>`;
  return `<div class="card"><h3>Chequeo de producto</h3>
  ${it("exh","Producto exhibido en nevera / anaquel asignado")}${it("precio","Precio visible y correcto")}${it("frio","Cadena de frío correcta")}${it("fifo","Rotación FIFO (lo más viejo adelante)")}${it("pop","Material POP colocado")}
  <div style="display:flex;gap:10px"><div style="flex:1"><label class="f">Temperatura nevera (°C)</label><input type="number" step="0.1" data-cf="temp" value="${esc(k.temp)}"></div>
  <div style="flex:1"><label class="f">Precio en anaquel Viena 1 kg ($)</label><input type="number" step="0.01" data-cf="pvp" value="${esc(k.pvp)}"></div></div>
  ${!isNaN(t)&&t>4?`<div class="alert red" style="margin-top:10px">⚠ <div>Temperatura sobre 4 °C. Riesgo de producto dañado: registre devolución si aplica.</div></div>`:""}
  <label class="f">Foto de exhibición</label><input type="file" accept="image/*" data-act="foto">${k.foto?`<img class="photo" src="${k.foto}">`:""}
  <label class="f">Observaciones</label><textarea rows="2" data-cf="obs">${esc(k.obs)}</textarea></div>
  <button class="btn full" data-act="chkok">Guardar chequeo ›</button>`}

function stepDev(c,v){const al=stockAlerts(v);
  return `${al.map(s=>{const p=CAT.find(x=>x.sku===s.sku);const dd=days(new Date(s.venc+"T00:00"),today);const reg=v.returns.find(r=>r.sku===s.sku);
   return `<div class="alert ${dd<0?"red":"amb"}">⚠ <div style="flex:1"><b>${p.n}</b> · ${s.ex} und · ${dd<0?`vencido hace ${-dd} días`:`vence en ${dd} días`}<br>${reg?`<span style="font-weight:600">✓ Devolución registrada (${reg.q} und)</span>`:`<button class="btn sm" style="margin-top:6px" data-dev="${s.sku}" data-q="${s.ex}" data-m="${dd<0?0:1}">Registrar devolución</button>`}</div></div>`}).join("")||`<div class="alert grn">✓ <div>Sin productos vencidos ni por vencer.</div></div>`}
  <div class="card"><h3>Devoluciones registradas</h3>${v.returns.length?`<table><thead><tr><th>Producto</th><th>Motivo</th><th class="r">Und</th></tr></thead><tbody>${v.returns.map((r,i)=>`<tr><td>${CAT.find(p=>p.sku===r.sku).n}</td><td class="muted">${r.mot}</td><td class="r">${r.q} <button class="btn ghost sm" data-deldev="${i}">✕</button></td></tr>`).join("")}</tbody></table>`:`<p class="muted" style="margin:0">Ninguna todavía.</p>`}
  <button class="btn sec sm" style="margin-top:10px" data-dev="" data-q="1" data-m="2">+ Otra devolución</button></div>
  <button class="btn full" data-act="devok">Continuar al pedido ›</button>`}

function stepPed(c,v){const t=vt(v);
  if(v.invoice)return `<div class="alert grn">✓ <div>Pedido facturado: <b>${v.invoice.n}</b> por ${usd(v.invoice.tot)}.</div></div><button class="btn full" data-step="5">Ver factura ›</button>`;
  return `<div class="card"><h3>Montar orden</h3><p class="muted" style="margin-top:0">Precargada con el sugerido (par − existencia). Ajuste las cantidades.</p>
  <table><thead><tr><th>Producto</th><th class="r">Precio</th><th class="r">Cant.</th></tr></thead><tbody>
  ${CAT.map(p=>{const o=v.order.find(x=>x.sku===p.sku);const s=v.stock.find(x=>x.sku===p.sku);return `<tr><td><div style="font-weight:500">${p.n}</div><div class="muted">Exist. ${s.ex} · sugerido ${Math.max(0,p.par-s.ex)}</div></td><td class="r mono">${usd(p.p)}</td><td class="r"><input class="q" type="number" min="0" inputmode="numeric" data-oq="${p.sku}" value="${o?o.q:0}"></td></tr>`}).join("")}
  </tbody></table>
  <div style="margin-top:10px"><div class="tot"><span>Subtotal</span><span class="mono" id="osub">${usd(t.sub)}</span></div><div class="tot"><span>IVA 16%</span><span class="mono" id="oiva">${usd(t.iva)}</span></div><div class="tot big"><span>Total</span><span class="mono" id="otot">${usd(t.tot)}</span></div></div></div>
  <div style="display:flex;gap:8px"><button class="btn sec" data-act="noorder">Sin pedido</button><button class="btn" style="flex:1" data-act="facturar">Confirmar y facturar ›</button></div>`}

function stepFac(c,v){
  if(!v.invoice)return `<div class="alert amb">ℹ <div>${v.noOrder?"Visita sin pedido, no hay factura.":"Primero confirme el pedido."}</div></div><button class="btn full" data-step="${v.noOrder?6:4}">${v.noOrder?"Ir a cobranza ›":"‹ Volver al pedido"}</button>`;
  const f=v.invoice;
  return `<div class="inv-doc"><div class="hd"><span>MEISTER · Factura</span><span class="mono">${f.n}</span></div>
  <div style="margin:8px 0 10px;font-size:13px"><b>${esc(c.nombre)}</b><br><span class="muted">${c.cod} · Emisión ${f.f} · Vence ${f.v} (${c.cred} días)</span></div>
  <table><tbody>${v.order.map(o=>{const p=CAT.find(x=>x.sku===o.sku);return `<tr><td>${o.q} × ${p.n}</td><td class="r mono">${usd(o.q*p.p)}</td></tr>`}).join("")}</tbody></table>
  <div style="margin-top:8px"><div class="tot"><span>Subtotal</span><span class="mono">${usd(f.sub)}</span></div><div class="tot"><span>IVA 16%</span><span class="mono">${usd(f.iva)}</span></div>
  <div class="tot big"><span>Total</span><span class="mono">${usd(f.tot)}</span></div><div class="tot muted"><span>Equivalente a tasa ${S.tasa}</span><span class="mono">${bs(f.tot*S.tasa)}</span></div>
  ${c.esp?`<div class="tot" style="color:var(--blu)"><span>Retención IVA ${S.retPct}% (contrib. especial)</span><span class="mono">−${usd(f.iva*S.retPct/100)}</span></div><div class="tot" style="font-weight:600"><span>Neto a cobrar</span><span class="mono">${usd(f.tot-f.iva*S.retPct/100)}</span></div>`:""}</div></div>
  <div class="alert grn" style="margin-top:10px">✓ <div>Orden <b>${f.oid||""}</b> emitida. Factura generada y agregada a la cuenta por cobrar del cliente. Cobro programado para el <b>${f.v}</b>.</div></div>
  <div style="display:flex;gap:8px"><button class="btn sec" style="flex:1" data-act="copyfac">Copiar factura</button><a class="btn sec" style="flex:1;text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(facText(c,v))}" target="_blank" rel="noopener">Enviar por WhatsApp</a></div>
  <button class="btn full" style="margin-top:8px" data-step="6">Continuar a cobranza ›</button>`}
function facText(c,v){const f=v.invoice;return `MEISTER · Factura ${f.n}\n${c.nombre} (${c.cod})\nEmisión ${f.f} · Vence ${f.v}\n`+v.order.map(o=>{const p=CAT.find(x=>x.sku===o.sku);return `${o.q} x ${p.n} = ${usd(o.q*p.p)}`}).join("\n")+`\nSubtotal ${usd(f.sub)}\nIVA ${usd(f.iva)}\nTotal ${usd(f.tot)} (${bs(f.tot*S.tasa)})`+(c.esp?`\nRetención IVA ${S.retPct}%: ${usd(f.iva*S.retPct/100)}\nNeto a cobrar: ${usd(f.tot-f.iva*S.retPct/100)}`:"")}

function invRow(c,f){const b=bucket(f.dv);const col=["c-grn","c-amb","c-amb","c-red","c-red"][b];
  return `<div class="it" data-pay="${c.cod}|${f.n}"><div class="main"><div class="nm mono" style="font-size:13px">Fact. ${f.n}</div><div class="meta">Emitida ${f.f} · vence ${f.v} <span class="chip ${col}">${f.dv<=0?(f.dv===0?"vence hoy":`faltan ${-f.dv}d`):`${f.dv}d vencida`}</span></div></div><div class="amt"><div class="mono">${usd(f.saldo)}</div><div class="muted">Cobrar ›</div></div></div>`}
function stepCob(c,v){const inv=invoices(c).sort((a,b)=>b.dv-a.dv);const pays=S.payments.filter(p=>p.cod===c.cod&&p.date===TODAY);
  return `<div class="card"><h3>Facturas pendientes · ${usd(inv.reduce((a,f)=>a+f.saldo,0))}</h3>${inv.length?`<div class="list">${inv.map(f=>invRow(c,f)).join("")}</div>`:`<p class="muted">Sin saldo pendiente.</p>`}</div>
  ${pays.length?`<div class="card"><h3>Cobrado en esta visita</h3><table><tbody>${pays.map(p=>`<tr><td class="mono">${p.fac}</td><td class="muted">${p.met}${p.ret?` · ret. ${usd(p.ret)}`:""}</td><td class="r mono">${usd(p.monto)}</td></tr>`).join("")}</tbody></table></div>`:""}
  ${v.closed?`<div class="alert grn">✓ <div>Visita cerrada a las ${hhmm(v.checkout)}.</div></div>`:`<button class="btn full" data-act="closevisit">Cerrar visita</button>`}`}

/* ---------- cobranza ---------- */
function cobranza(){
  const all=[];clients().forEach(c=>invoices(c).forEach(f=>all.push({c,f})));
  const groups=[[4,"Vencidas más de 22 días"],[3,"Vencidas 15–21 días"],[2,"Vencidas 8–14 días"],[1,"Vencidas 1–7 días"],[0,"Por vencer"]];
  const st=dayStats();const sent=S.sent[TODAY];
  const byM={};st.ps.forEach(p=>byM[p.met]=(byM[p.met]||0)+p.monto);
  return `<div class="card"><h3>Reporte de cobranza del día</h3>
  <div class="tot"><span>Cobros registrados</span><span>${st.ps.length}</span></div>
  ${Object.entries(byM).map(([m,x])=>`<div class="tot muted"><span>${m}</span><span class="mono">${usd(x)}</span></div>`).join("")}
  <div class="tot"><span>Retenciones IVA recibidas</span><span class="mono">${usd(st.ret)}</span></div>
  <div class="tot big"><span>Total cobrado</span><span class="mono">${usd(st.cob)}</span></div>
  ${S.orders.some(o=>ost(o)==="cobrada")?`<div class="muted" style="margin-top:6px">Al enviar, las órdenes cobradas pasan a <b>Reportada</b>.</div>`:""}
  ${sent?`<div class="alert grn" style="margin:10px 0 0">✓ <div>Reportado a administración a las <b>${hhmm(sent)}</b>${st.ps.length>(S.sentN||0)?" · hay cobros nuevos desde entonces":""}.</div></div>`:""}
  <button class="btn full" style="margin-top:10px" data-act="sendcob" ${st.ps.length?"":"disabled"}>${sent?"Reenviar reporte":"Enviar reporte de cobranza"}</button></div>
  ${groups.map(([b,l])=>{const it=all.filter(x=>bucket(x.f.dv)===b).sort((a,z)=>z.f.dv-a.f.dv);if(!it.length)return"";
   return `<div class="sec-t">${l} · ${usd(it.reduce((a,x)=>a+x.f.saldo,0))}</div><div class="card list" style="padding:0 14px">${it.map(({c,f})=>{const r=invRow(c,f);return r.replace('<div class="nm mono" style="font-size:13px">',`<div class="nm" style="font-size:13px">${esc(c.nombre)}</div><div class="nm mono" style="font-size:12px;font-weight:400;color:var(--mut)">`)}).join("")}</div>`}).join("")}`}

/* ---------- alertas ---------- */
function alertList(){
  const out=[];
  clients().forEach(c=>{const b=cxc(c);if(b[4]>0)out.push({t:"red",c,msg:`${usd(b[4])} vencido con más de 22 días`});
    const due=invoices(c).filter(f=>f.dv>=-2&&f.dv<=0);if(due.length)out.push({t:"amb",c,msg:`${due.length} factura(s) vencen en los próximos 2 días · ${usd(due.reduce((a,f)=>a+f.saldo,0))}`});
    const v=visitOf(c.cod);if(v){const al=stockAlerts(v).filter(s=>!v.returns.find(r=>r.sku===s.sku));if(al.length)out.push({t:"red",c,msg:`${al.length} producto(s) vencidos/por vencer sin devolución registrada`})}});
  return out}

function reportes(){
  const st=dayStats();

  const rows=UI.rep==="dia"?[todayRow]:[todayRow,...S.hist].sort((a,b)=>a.date<b.date?-1:1);
  const T=rows.reduce((a,r)=>{for(const k in r)if(k!=="date")a[k]=(a[k]||0)+r[k];return a},{});

  `<div class="card"><h3>Productos vendidos hoy</h3>${Object.keys(prod).length?`<table><tbody>${Object.entries(prod).sort((a,b)=>b[1]-a[1]).map(([k,q])=>`<tr><td>${CAT.find(p=>p.sku===k).n}</td><td class="r">${q} und</td></tr>`).join("")}</tbody></table>`:`<p class="muted" style="margin:0">Aún no hay pedidos hoy.</p>`}</div>`}
  <div class="card"><h3>Órdenes por estado</h3>${STATUS.map(([k,l,cl])=>{const os=S.orders.filter(o=>ost(o)===k&&(UI.rep==="sem"||o.date===TODAY||k!=="reportada"));return `<div class="tot"><span><span class="chip ${cl}">${l}</span></span><span>${os.length} · <span class="mono">${usd(os.reduce((a,o)=>a+o.tot,0))}</span></span></div>`}).join("")}</div>

function pressKey(k){
  if(k==="back"){LG={step:"who",who:null,pin:"",err:"",tmp:null};return render()}
  if(k==="del"){LG.pin=LG.pin.slice(0,-1);LG.err="";return render()}
  if(LG.pin.length>=PINLEN())return;LG.pin+=k;LG.err="";render();
  if(LG.pin.length<PINLEN())return;
  setTimeout(()=>{const p=LG.pin;LG.pin="";
    if(LG.who==="__admin"&&window.API_URL){adminRemote(p);return}
    if(LG.who==="__admin"){const a=LS.get(AKEY,null);

      else if(a!==pinH(p)){LG.err="PIN incorrecto";return render()}
      setSes({role:"admin"});LG={step:"who",who:null,pin:"",err:"",tmp:null};UI={tab:"ruta",visit:null,step:0,rep:"dia",modal:null,per:"sem"};return render()}
    if(LG.who==="__desp"){if(sellerPin("Despacho")!==pinH(p)){LG.err="PIN incorrecto";return render()}setSes({role:"desp"});LG={step:"who",who:null,pin:"",err:"",tmp:null};UI={tab:"home",visit:null,step:0,rep:"dia",modal:null};return render()}

function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Copiado al portapapeles")}catch(e){toast("No se pudo copiar; seleccione el texto")}}

function payModal(cod,n){const c=cli(cod);const f=invoices(c).find(x=>x.n===n);if(!f)return;
  const ivaF=f.saldo*IVA/(1+IVA);const retDef=c.esp?Math.round(ivaF*S.retPct)/100:0;
  openModal(`<h3>Registrar cobro</h3><div class="muted">${esc(c.nombre)} · Fact. ${n} · saldo <b>${usd(f.saldo)}</b> · ${f.dv>0?f.dv+" días vencida":"al día"}</div>
  ${c.esp?`<div class="alert blu" style="margin-top:10px">ℹ <div>Contribuyente especial. Retención IVA ${S.retPct}% estimada: <b>${usd(retDef)}</b>. Registre el Nº de comprobante.</div></div>`:""}
  <label class="f">Método</label><select id="pm">${MET.map(m=>`<option>${m}</option>`).join("")}</select>
  <div style="display:flex;gap:10px"><div style="flex:1"><label class="f">Monto recibido ($)</label><input id="pa" type="number" step="0.01" value="${(f.saldo-retDef).toFixed(2)}"></div><div style="flex:1"><label class="f">Referencia</label><input id="pr" placeholder="Nº operación"></div></div>
  ${c.esp?`<div style="display:flex;gap:10px"><div style="flex:1"><label class="f">Retención IVA ($)</label><input id="pt" type="number" step="0.01" value="${retDef.toFixed(2)}"></div><div style="flex:1"><label class="f">Nº comprobante</label><input id="pc" placeholder="2026110001234"></div></div>`:""}
  <div class="muted" id="peq" style="margin-top:8px"></div><div id="perr" style="color:var(--red);font-size:13px;margin-top:6px"></div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn sec" data-act="mclose">Cancelar</button><button class="btn" style="flex:1" data-act="paysave" data-k="${cod}|${n}">Guardar cobro</button></div>`,
  ()=>{const upd=()=>{$("#peq").textContent="Equivale a "+bs((parseFloat($("#pa").value)||0)*S.tasa)+" a tasa "+S.tasa};$("#pa").oninput=upd;upd()})}
function savePay(k){const[cod,n]=k.split("|");const c=cli(cod);const f=invoices(c).find(x=>x.n===n);
  const m=parseFloat($("#pa").value)||0,r=c.esp?(parseFloat($("#pt").value)||0):0,comp=c.esp?$("#pc").value.trim():"";
  if(m<=0&&r<=0)return $("#perr").textContent="Indique un monto.";
  if(m+r>f.saldo+0.01)return $("#perr").textContent="El monto más la retención supera el saldo.";
  if(c.esp&&r>0&&!comp)return $("#perr").textContent="Falta el Nº de comprobante de retención.";
  S.payments.push({date:TODAY,ts:Date.now(),cod,fac:n,met:$("#pm").value,ref:$("#pr").value.trim(),monto:m,ret:r,comp});syncPaid();save();UI.modal=null;render();toast("Cobro registrado")}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-open],[data-step],[data-act],[data-pay],[data-dev],[data-deldev],[data-rep],[data-nvs],[data-pick],[data-pdv],[data-of],[data-ord],[data-who],[data-key],[data-per],[data-seller],[data-pinset]");if(!t)return;
  if(e.target.id==="mdl")return closeModal();
  const d=t.dataset;
  if(d.who){LG={step:"pin",who:d.who,pin:"",err:"",tmp:null};render();return}
  if(d.key){pressKey(d.key);return}
  if(d.per){UI.per=d.per;render();return}
  if(d.seller){sellerModal(d.seller);return}
  if(d.pinset){pinModal(d.pinset);return}
  if(d.act==="logout"){UI.modal=null;logout();return}
  if(d.act==="savepin"){const p=$("#npin").value.trim();if(!/^\d{4}$/.test(p)){$("#perr").textContent="Deben ser 4 dígitos.";return}const m=LS.get(PKEY,{});m[d.v]=pinH(p);LS.set(PKEY,m);UI.modal=null;render();toast("PIN asignado a "+d.v);return}
  if(d.act==="mclose"&&SES&&SES.role==="admin"){closeModal();return}
  if(d.tab){if(d.tab!==UI.tab)(UI.hist=UI.hist||[]).push(UI.tab);UI.tab=d.tab;UI.modal=null;UI.page=null;render();window.scrollTo(0,0);return}
  if(d.nvs!==undefined){if(t.disabled)return;D().step=+d.nvs;save();render();scrollTo(0,0);return}
  if(d.pick){const x=D();if(x.cod!==d.pick){x.cod=d.pick;x.pdv=pdvs(d.pick).length===1?"P0":null}save();render();return}
  if(d.pdv){D().pdv=d.pdv;save();render();return}
  if(d.of){UI.of=UI.of===d.of?"todas":d.of;render();return}
  if(d.ord){ordModal(d.ord);return}
  if(d.open){startVisit(d.open);return}
  if(d.step!==undefined){UI.step=+d.step;render();window.scrollTo(0,0);return}
  if(d.pay){const[c,n]=d.pay.split("|");UI.modal=null;payModal(c,n);return}
  if(d.dev!==undefined){devModal(d.dev,d.q,d.m);return}
  if(d.deldev!==undefined){curV().returns.splice(+d.deldev,1);save();render();return}
  if(d.rep){UI.rep=d.rep;render();return}
  const v=UI.visit&&curV();
  switch(d.act){
    case"close":UI.visit=null;render();break;
    case"checkin":v.checkin=Date.now();save();render();break;
    case"invok":v.stepInv=true;save();UI.step=2;render();scrollTo(0,0);break;
    case"chkok":v.stepChk=true;save();UI.step=3;render();scrollTo(0,0);break;
    case"devok":v.stepDev=true;save();UI.step=4;render();scrollTo(0,0);break;
    case"noorder":v.noOrder=true;v.order=[];save();UI.step=6;render();break;
    case"facturar":{const t=vt(v);if(t.sub<=0){toast("La orden está vacía");break}
      v.order=v.order.filter(o=>o.q>0);const o=buildOrder(S,v.cod,pdvs(v.cod)[0],v.order,v.check.obs||"","Visita",TODAY,today);o.hist.emitida=Date.now();
      v.invoice={n:o.fac,f:o.f,v:o.venc,sub:o.sub,iva:o.iva,tot:o.tot,oid:o.id};save();UI.step=5;render();scrollTo(0,0);break}
    case"copyfac":copy(facText(cli(v.cod),v));break;
    case"closevisit":if(!v.checkin)v.checkin=Date.now();v.checkout=Date.now();v.closed=true;save();UI.visit=null;render();toast("Visita cerrada");break;
    case"mclose":closeModal();break;
    case"newcli":newCliModal();break;
    case"me":meModal();break;
    case"newpdv":newPdvModal();break;
    case"savecli":{const n=$("#nc_n").value.trim();if(!n){$("#perr").textContent="Indique la razón social.";break}
      const c={cod:"NV"+String(S.newClients.length+1).padStart(4,"0"),nombre:n.toUpperCase(),rif:$("#nc_r").value.trim(),dir:$("#nc_d").value.trim(),cred:+$("#nc_c").value,esp:$("#nc_e").checked,facturas:[],nuevo:true};
      S.newClients.push(c);S.cart=newCart(c.cod,false);save();UI.modal=null;UI.page=null;UI.tab="venta";render();toast("Cliente creado · ya puedes venderle");break}
    case"savepdv":{const n=$("#np_n").value.trim();if(!n){$("#perr").textContent="Indique el nombre del PDV.";break}
      const x=S.cart&&S.cart.cod?S.cart:D();const l=S.pdv[x.cod]=S.pdv[x.cod]||[];const p={id:"P"+(l.length+1),nombre:n,dir:$("#np_d").value.trim(),contacto:$("#np_c").value.trim(),tel:$("#np_t").value.trim(),horario:$("#np_h").value.trim()};
      l.push(p);x.pdv=p.id;save();UI.modal=null;render();break}
    case"emitir":{const x=D();const o=buildOrder(S,x.cod,pdvs(x.cod).find(p=>p.id===x.pdv),Object.entries(x.items).map(([sku,q])=>({sku,q})),x.obs,"Nueva venta",x.entrega,today);o.hist.emitida=Date.now();
      S.draft=null;save();UI.tab="ord";UI.of="todas";render();scrollTo(0,0);ordModal(o.id);toast("Orden "+o.id+" emitida");break}
    case"despachar":{const o=S.orders.find(x=>x.id===d.id);o.guia=$("#guia").value.trim();o.hist.despachada=Date.now();save();ordModal(o.id);toast("Orden despachada");break}
    case"reportar":{const o=S.orders.find(x=>x.id===d.id);o.hist.reportada=Date.now();save();ordModal(o.id);toast("Orden reportada");break}
    case"copyord":copy(ordText(S.orders.find(x=>x.id===d.id)));break;
    case"paysave":savePay(d.k);break;
    case"devsave":v.returns.push({sku:$("#ds").value,q:parseInt($("#dq").value)||1,lote:$("#dl").value,mot:$("#dm").value});save();closeModal();break;
    case"sendcob":markSent("cob");{const nr=S.orders.filter(o=>ost(o)==="cobrada");nr.forEach(o=>o.hist.reportada=Date.now());if(nr.length)setTimeout(()=>toast(nr.length+" orden(es) pasan a Reportada"),2300)}S.sent[TODAY]=Date.now();S.sentN=dayStats().ps.length;save();render();copy(cobText());toast("Reporte enviado (texto copiado)");break;
    case"copyrep":copy($("#reptxt").textContent);break;
    case"reset":openModal(`<h3>¿Reiniciar la demo?</h3><p class="muted">Se borran visitas, pedidos y cobros de hoy para ${esc(S.vend)} en este navegador.</p><div style="display:flex;gap:8px"><button class="btn sec" data-act="mclose" style="flex:1">Cancelar</button><button class="btn" data-act="doreset" style="flex:1">Reiniciar</button></div>`);break;
    case"doreset":S=blank(S.vend);save();UI.modal=null;render();break;
  }
});
function cobText(){const st=dayStats();return `MEISTER · Reporte de cobranza ${fdmy(today)}\nVendedor: ${S.vend}\n\n`+st.ps.map(p=>`${cli(p.cod).nombre} · Fact ${p.fac} · ${p.met}${p.ref?" ref "+p.ref:""} · ${usd(p.monto)}${p.ret?` · ret ${usd(p.ret)} comp ${p.comp}`:""}`).join("\n")+`\n\nTotal cobrado: ${usd(st.cob)}\nRetenciones: ${usd(st.ret)}`}
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.goal){const m=LS.get(GKEY,{});m[t.dataset.goal]=Math.max(1,parseFloat(t.value)||2000);LS.set(GKEY,m);toast("Meta actualizada");return}
  if(t.dataset.pf){S.profile[t.dataset.pf]=t.value;save();return}
  if(t.dataset.nf){D()[t.dataset.nf]=t.value;save();return}
  const v=UI.visit&&curV();if(!v)return;const d=t.dataset;
  if(d.ex!==undefined){v.stock[+d.ex].ex=Math.max(0,parseInt(t.value)||0);const s=v.stock[+d.ex],p=CAT.find(x=>x.sku===s.sku);if(!v.invoice){const o=v.order.find(x=>x.sku===s.sku);const q=Math.max(0,p.par-s.ex);if(o)o.q=q;else if(q)v.order.push({sku:s.sku,q})}save();render()}
  if(d.vc!==undefined){v.stock[+d.vc].venc=t.value;save();render()}

function afterRender(){const cv=$("#sig");if(!cv||cv._ok)return;cv._ok=true;const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;const x=cv.getContext("2d");x.scale(2,2);x.lineWidth=2.2;x.lineCap="round";x.strokeStyle="#1d1b1a";
  if(S.cart&&S.cart.sig){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=S.cart.sig}
  let d=false;const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{d=true;cv.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b)};
  cv.onpointermove=e=>{if(!d)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
  cv.onpointerup=()=>{d=false;S.cart.sig=cv.toDataURL("image/png");save()}}

  }

/* ---------- vencimiento calculado con la última visita ----------
   lote = fecha de la última entrega · vence = lote + vida útil (120 días)
   rotación = (exist. última visita + entregado − exist. hoy) / días entre visitas
   riesgo = si al ritmo actual no se agota antes de vencer                       */
function clientSkus(c){const r=rnd(hash(c.cod+"sk"));const pool=[...CAT];const out=[];
  const want=c.cadena?["auto","auto","auto","auto","peso","peso","peso","peso"]:["auto","auto","auto","peso","peso","peso","peso","peso"];
  want.forEach(t=>{const l=pool.filter(p=>p.pres===t);const p=l[Math.floor(r()*l.length)];out.push(p);pool.splice(pool.indexOf(p),1)});return out}
function stock(c){const r=rnd(hash(c.cod+S.vend+"st"));const lastD=7+Math.floor(r()*8);
  return clientSkus(c).map(p=>{const loteAge=[25,40,60,85,100,108,112,118,126][Math.floor(r()*9)];const del=Math.max(p.step,Math.round(p.par*(0.6+r()*0.8)/p.step)*p.step);
    const exL=Math.floor(r()*p.par*0.6);const rate=(p.pres==="peso"?0.05:0.6)*(0.3+r()*1.6);
    const est=Math.max(0,Math.round(exL+del-rate*lastD));
    return{sku:p.sku,ex:est,est,last:{date:iso(addD(today,-lastD)),ex:exL,del},lote:iso(addD(today,-loteAge)),venc:iso(addD(today,-loteAge+p.vida))}})}
function sCalc(v,s){const p=PROD(s.sku);const ds=Math.max(1,days(today,new Date(s.last.date+"T00:00")));const sold=Math.max(0,s.last.ex+s.last.del-s.ex);const rate=sold/ds;
  const dv=days(new Date(s.venc+"T00:00"),today);const agota=rate>0?s.ex/rate:Infinity;const left=s.ex>0?Math.max(0,Math.ceil(s.ex-rate*Math.max(0,dv))):0;
  let st="ok";if(s.ex>0&&dv<0)st="venc";else if(s.ex>0&&agota>dv&&left>0)st="riesgo";else if(s.ex>0&&dv<=15)st="pronto";
  return{rate,ds,sold,dv,agota,left,st,devQ:st==="venc"?s.ex:st==="riesgo"?left:0}}
function stockAlerts(v){return v.stock.filter(s=>{const k=sCalc(v,s).st;return k==="venc"||k==="riesgo"})}
function suggest(cod){const v=visitOf(cod);const out={};const rnd8=(p,q)=>Math.ceil(q/p.step)*p.step;
  if(v&&v.stock){v.stock.forEach(s=>{const p=PROD(s.sku);const k=sCalc(v,s);if(k.st==="venc"||k.st==="riesgo")return;
    const cover=Math.max(p.par,Math.round(k.rate*14));const q=Math.max(0,cover-s.ex);if(q>0)out[s.sku]=rnd8(p,q)});return out}
  const l=lastOrder(cod);if(l){l.items.forEach(i=>{if(PROD(i.sku))out[i.sku]=i.q});return out}
  clientSkus(cli(cod)).forEach(p=>out[p.sku]=p.pres==="peso"?p.par:p.step);return out}
function cartT(k){const it=Object.entries(k.items).filter(([s,q])=>q>0&&PROD(s));const sub=it.reduce((a,[s,q])=>a+q*PROD(s).p,0);
  const paq=it.filter(([s])=>PROD(s).pres==="auto").reduce((a,[,q])=>a+q,0),pz=it.filter(([s])=>PROD(s).pres==="peso").reduce((a,[,q])=>a+q,0);
  return{sub,iva:sub*IVA,tot:sub*(1+IVA),n:it.length,u:[paq?paq+" paq":"",pz?(Math.round(pz*10)/10).toLocaleString("es-VE")+" kg":""].filter(Boolean).join(" · ")||"0"}}

function cobRows(){return clients().map(c=>{const inv=invoices(c).sort((a,z)=>z.dv-a.dv);const vm=inv.filter(f=>f.dv>0).reduce((a,f)=>a+f.saldo,0);const maxd=inv.length?Math.max(...inv.map(f=>f.dv)):0;
  const tot=inv.reduce((a,f)=>a+f.saldo,0);const score=inv.reduce((a,f)=>a+f.saldo*(f.dv>0?1+f.dv/7:Math.max(.05,1+f.dv/30)),0);
  const pr=maxd>22||vm>1000?["Alta","c-red"]:vm>0?["Media","c-amb"]:["Baja","c-grn"];return{c,inv,vm,maxd,tot,score,pr}}).filter(r=>r.inv.length).sort((a,b)=>({Alta:0,Media:1,Baja:2}[a.pr[0]]-{Alta:0,Media:1,Baja:2}[b.pr[0]])||b.score-a.score)}

/* La tasa publicada se actualiza sola cada día hábil (tarea programada que republica la página).
   Si el administrador carga una tasa manual más reciente, prevalece esa. */
function tasaVigente(fv){if(!fv)return false;if(fv>=TODAY)return true;const d=new Date(TODAY+"T00:00").getDay();const lag=days(today,new Date(fv+"T00:00"));return (d===6&&lag<=1)||(d===0&&lag<=2)}
const tasaHoy=()=>{const m=LS.get(TKEY,null);const p=(window.TASA_DRIVE&&window.TASA_DRIVE.fv>=TASA_PUB.fv)?window.TASA_DRIVE:TASA_PUB;
  if(m&&m.date>=p.fv)return{v:m.v,date:m.date,hoy:m.date===TODAY||tasaVigente(m.date),src:"Ajuste manual del administrador",manual:true};
  return{v:p.v,date:p.fv,hoy:tasaVigente(p.fv),src:p.src,at:p.at,manual:false}};

  return m>0?{monto:m,dias:Math.max(...inv.map(f=>f.dv))}:null})}
function buildOrder(st,cod,pdv,items,obs,origen,entrega,date){
  items=items.filter(i=>i.q>0&&PROD(i.sku)).map(i=>({sku:i.sku,q:i.q,p:PROD(i.sku).p}));
  const sub=items.reduce((a,i)=>a+i.q*i.p,0),iva=sub*IVA,tot=sub+iva;
  const o={id:"PED-"+String(st.oseq++).padStart(5,"0"),date:iso(date),cod,pdv,items,sub,iva,tot,fac:null,obs,entrega,origen,vend:st.vend,guia:"",hist:{emitida:+date+9*36e5}};
  st.orders.unshift(o);return o}
/* despacho: peso real → factura del sistema administrativo */
function dispatchOrder5(st,o,kgReal,guia,when){const c=allClients(st).idx.get(o.cod);
  const lines=o.items.map((it,i)=>{const p=PROD(it.sku);if(p.pres==="peso"){const kg=+(kgReal&&kgReal[i]!=null?kgReal[i]:it.q*p.kg);return{...it,kg,tot:Math.round(kg*p.pk*100)/100}}return{...it,tot:Math.round(it.q*it.p*100)/100}});
  const sub=lines.reduce((a,l)=>a+l.tot,0),iva=sub*IVA,tot=Math.round((sub+iva)*100)/100;const d=when||new Date();const n=String(++st.seq).padStart(8,"0");const ven=addD(d,c.cred);
  (st.newInv[o.cod]=st.newInv[o.cod]||[]).push({n,f:fdmy(d),v:fdmy(ven),s:tot});
  Object.assign(o,{real:{lines,sub,iva,tot},fac:n,ctrl:"00-"+String(hash(n+o.id)%900000+100000),f:fdmy(d),venc:fdmy(ven),guia:guia||o.guia});o.hist.despachada=+d;return o}
function demoOrders(st){const cl=SEED[st.vend];const r=rnd(hash(st.vend+"o"));
  [[4,"reportada"],[3,"cobrada"],[2,"despachada"],[1,"despachada"],[1,"emitida"]].forEach(([back,status],i)=>{const c=cl[(i*3+1)%cl.length];const d=addD(today,-back);
    const items=[0,1,2].map(()=>CAT[Math.floor(r()*CAT.length)]).filter((p,j,a)=>a.indexOf(p)===j).map(p=>({sku:p.sku,q:p.pres==="peso"?Math.round((1+Math.floor(r()*3))*p.pz*2)/2:p.step*(1+Math.floor(r()*2))}));
    const o=buildOrder(st,c.cod,{id:"P0",nombre:"Principal",dir:"Dirección fiscal"},items,"","Demo",iso(addD(d,1)),d);
    if(status!=="emitida"){const kg=o.items.map(it=>{const p=PROD(it.sku);return p.pres==="peso"?Math.round(it.q*p.kg*(0.93+r()*0.12)*100)/100:null});dispatchOrder(st,o,kg,"NE-"+(4100+i),new Date(+d+26*36e5))}
    if(status==="cobrada"||status==="reportada"){const ret=c.esp?Math.round(o.real.iva*st.retPct)/100:0;const pdate=addD(d,Math.min(back,2));
      st.payments.push({date:iso(pdate),ts:+pdate+15*36e5+i,cod:c.cod,fac:o.fac,met:"Transferencia Bs",ref:"DEMO"+i,monto:Math.round((o.real.tot-ret)*100)/100,ret,comp:ret?"20261100"+(500+i):"",ver:"ok",tasa:896.12});
      o.hist.cobrada=+pdate+18*36e5}
    if(status==="reportada")o.hist.reportada=o.hist.cobrada+3*36e5});
  st.orders.sort((a,b)=>b.hist.emitida-a.hist.emitida)}

/* normaliza pagos viejos al nuevo formato */
function relRow6(p){const mon=p.moneda||(p.montoBs||/Bs|Móvil/.test(p.met||"")?"bs":"usd");const tp=p.tipo||({"Transferencia Bs":"Transferencia","Pago Móvil":"Pago Móvil","Zelle":"Zelle","Efectivo USD":"Efectivo","Efectivo Bs":"Efectivo"}[p.met]||p.met);
  const orig=p.montoOrig!=null?p.montoOrig:(mon==="bs"?(p.montoBs||p.monto*(p.tasa||S.tasa)):p.monto);
  return{...p,mon,tp,orig,fac:p.facN||p.fac||"",fpago:p.fpago||p.date,banco:p.banco||(tp==="Efectivo"?"—":"No indicado"),entCob:!!p.entCob,entFac:!!p.entFac}}
function relList(per){const desde=per==="sem"?iso(addD(today,-6)):TODAY;return S.payments.filter(p=>p.date>=desde&&p.date<=TODAY&&p.ver!=="rech").map(relRow).sort((a,b)=>a.ts-b.ts)}
function relTot(L){const bsT=L.filter(r=>r.mon==="bs").reduce((a,r)=>a+r.orig,0),usdL=L.filter(r=>r.mon==="usd");
  return{bs:bsT,bsUsd:L.filter(r=>r.mon==="bs").reduce((a,r)=>a+r.monto,0),usd:usdL.reduce((a,r)=>a+r.orig,0),zelle:usdL.filter(r=>r.tp==="Zelle").reduce((a,r)=>a+r.orig,0),cash:usdL.filter(r=>r.tp==="Efectivo").reduce((a,r)=>a+r.orig,0),

function savePay6(){const cod=$("#rc_cli").value;const c=cod&&cli(cod);const T=tasaHoy();
  const facN=$("#rc_fac").value.trim(),fpago=$("#rc_fec").value,mon=$("#rc_mon").value,tp=$("#rc_tp").value,bank=$("#rc_bank")?$("#rc_bank").value:"",ref=$("#rc_ref").value.trim(),orig=parseFloat($("#rc_monto").value)||0;

const sentAt=(st,k)=>((st.sentRep||{})[TODAY]||{})[k];
function markSent(k){S.sentRep=S.sentRep||{};S.sentRep[TODAY]=S.sentRep[TODAY]||{};S.sentRep[TODAY][k]=Date.now();
  if(k==="cob"){S.sent[TODAY]=Date.now();S.sentN=dayStats().ps.length;S.orders.filter(o=>ost(o)==="cobrada").forEach(o=>o.hist.reportada=Date.now())}
  if(k==="ped")pedList("dia").forEach(o=>{if(!o.sentFac)o.sentFac=Date.now()});save()}
/* resumen de visitas arriba del reporte de pedidos */
function pedResumen(per){const d=dayStats();let v=d.visitas,p=d.pedidos;if(per==="sem")S.hist.forEach(h=>{v+=h.visitas;p+=h.pedidos});
  return `Visitas: ${v} · Pedidos: ${p} · Efectividad: ${v?Math.min(100,Math.round(p/v*100)):0}%`}
function repPedText(per){const t=pedText(per);const i=t.indexOf("\n\n");return t.slice(0,i)+"\n"+pedResumen(per)+t.slice(i)}
function repCobText(per){return relText(per)}

function reportes(){const sec=UI.rsec||"ped";const per=UI.rep==="sem"?"sem":"dia";const D=dest();
  const sP=sentAt(S,"ped"),sC=sentAt(S,"cob");
  const st=(t)=>t?`<i class="ok">✓ Enviado ${hhmm(t)}</i>`:`<i class="pen">Pendiente hoy</i>`;
  const txt=sec==="ped"?repPedText(per):repCobText(per);const num=sec==="ped"?D.pedWa:D.cobWa;
  let kp="";
  if(sec==="ped"){const T=pedTot(pedList(per));kp=`<div class="relk"><div><span>Pedidos</span><b>${T.n}</b></div><div><span>Paq · kg</span><b>${T.paq} · ${(Math.round(T.pz*10)/10).toLocaleString("es-VE")}</b></div><div><span>Monto estimado</span><b class="mono">${usd(T.tot)}</b></div></div>`}
  else{const T=relTot(relList(per));kp=`<div class="relk"><div><span>Bolívares</span><b class="mono">${fmtBs(T.bs)}</b></div><div><span>Divisas</span><b class="mono">${usd(T.usd)}</b></div><div><span>Total equiv.</span><b class="mono">${usd(T.eq)}</b></div></div>`;const rp=retPend();kp+=`<button class="retk" data-cm="ret" data-tab="cob">🧾 <span>Total retenciones pendientes</span><b class="mono">${usd(rp.reduce((a,p)=>a+p.ret,0))}</b><small>${rp.length} sin comprobante ›</small></button>`}
  const mailBtn=sec==="cob"&&D.cobVia!=="wa"&&D.cobMail?`<a class="btn big full" style="margin-top:8px;text-decoration:none;background:var(--blu)" data-sendrep="cob" data-per="${per}" href="${mailLink(D.cobMail,`Relación de Cobranzas · ${S.vend} · ${fd(TODAY)}`,txt)}">✉️ Enviar por correo a ${esc(D.cobMail)}</a>`:"";
  const waBtn=sec==="cob"&&D.cobVia==="mail"?"":`<a class="btn big full" style="margin-top:12px;text-decoration:none;background:#1f8a4c" data-sendrep="${sec}" data-per="${per}" href="${waLink(num,txt)}" target="_blank" rel="noopener">📲 Enviar ${sec==="ped"?"reporte de pedidos":"relación de cobranzas"}${per==="sem"?" semanal":" del día"} a ${waFmt(num)}</a>`;
  return `<div class="seg2 big2"><button data-rsec="ped" class="${sec==="ped"?"on":""}"><b>📦 Relación de Pedidos</b><span>${st(sP)}</span></button><button data-rsec="cob" class="${sec==="cob"?"on":""}"><b>💵 Relación de Cobranzas</b><span>${st(sC)}</span></button></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="margin:0">${sec==="ped"?"Relación de Pedidos":"Relación de Cobranzas"}</h3>
   <div class="seg" style="margin:0;width:150px"><button data-rep="dia" class="${per==="dia"?"on":""}">Hoy</button><button data-rep="sem" class="${per==="sem"?"on":""}">Semana</button></div></div>
  ${kp}<div class="muted" style="margin:0 2px 8px">Se envía a <b>${sec==="ped"?"Pedidos / Facturación":"Cobranza"}</b> · ${sec==="cob"&&D.cobVia==="mail"?esc(D.cobMail):waFmt(num)}${sec==="cob"&&D.cobVia==="both"&&D.cobMail?" y "+esc(D.cobMail):""}</div>
  <pre class="rep">${esc(txt)}</pre>
  ${waBtn}${mailBtn}<button class="btn ghost full" data-copyrep="${sec}">Copiar texto</button></div>
  ${sec==="ped"?`<button class="btn sec full" data-tab="venta">＋ Levantar pedido</button>`:`<button class="btn sec full" data-pay6="1">＋ Registrar cobro</button>`}`}

/* v10 · Cuentas por Cobrar en una burbuja + reporte */
function cxcSum(){const b=[0,0,0,0,0];let n=0;const rows=cobRows();rows.forEach(r=>r.inv.forEach(f=>{b[bucket(f.dv)]+=f.saldo;n++}));const t=b.reduce((a,x)=>a+x,0);return{b,t,n,cl:rows.length,venc:t-b[0],rows}}
function cxcText(full){const X=cxcSum();const rp=retPend();const pct=X.t?Math.round(X.venc/X.t*100):0;
  let rows=X.rows;let cut=0;if(!full&&rows.length>15){cut=rows.length-15;rows=rows.slice(0,15)}
  return `*MEISTER · CUENTAS POR COBRAR*\nVendedor: ${S.vend}\nCorte: ${fd(TODAY)} · Tasa BCV: ${S.tasa.toLocaleString("es-VE",{minimumFractionDigits:2})}\n\n*RESUMEN*\nTotal cartera: ${usd(X.t)} (${X.n} facturas · ${X.cl} clientes)\n`+
  BUCK.map((k,i)=>`${k[0]}: ${usd(X.b[i])}`).join("\n")+`\nVencido: ${usd(X.venc)} (${pct}%)\nRetenciones pendientes: ${rp.length} · ${usd(rp.reduce((a,p)=>a+p.ret,0))}\n\n*FACTURAS PENDIENTES (por prioridad)*\n`+
  rows.map((r,i)=>`${i+1}) *${r.c.nombre}* (${r.c.cod}) · Prioridad ${r.pr[0]}\n`+r.inv.map(f=>`   Fact ${f.n} · Emisión ${f.f} · Vence ${f.v} · ${f.dv>0?f.dv+" días vencida":f.dv===0?"vence hoy":"faltan "+(-f.dv)+" días"} · Saldo ${usd(f.saldo)}${f.pend?` (por verificar ${usd(f.pend)})`:""}`).join("\n")+`\n   Total cliente: ${usd(r.tot)}${r.vm>0?` · vencido ${usd(r.vm)}`:""}`).join("\n\n")+
  (cut?`\n\n… y ${cut} cliente(s) más (ver detalle completo con "Copiar texto").`:"")+
  `\n\n*RETENCIONES PENDIENTES*\n`+(rp.length?rp.map((p,i)=>{const c=cli(p.cod);return `${i+1}) ${c?c.nombre:p.cod} · Fact ${p.fac} · cobrada ${fd(p.date)} · Ret ${usd(p.ret)} · hace ${p.age} días`}).join("\n")+`\nTotal: ${usd(rp.reduce((a,p)=>a+p.ret,0))}`:"Ninguna")}
function cxcModal(){const D=dest();const txt=cxcText(false);
  openModal(`<div class="grab"></div><h3>Reporte de Cuentas por Cobrar</h3><div class="muted">Corte ${fd(TODAY)} · se envía a Cobranza ${waFmt(D.cobWa)}</div>
  <pre class="rep" style="margin-top:12px;max-height:46vh">${esc(cxcText(true))}</pre>
  <a class="btn big full" style="margin-top:12px;text-decoration:none;background:#1f8a4c" href="${waLink(D.cobWa,txt)}" target="_blank" rel="noopener">📲 Enviar a ${waFmt(D.cobWa)}</a>
  ${D.cobMail?`<a class="btn big full" style="margin-top:8px;text-decoration:none;background:var(--blu)" href="${mailLink(D.cobMail,`Cuentas por Cobrar · ${S.vend} · ${fd(TODAY)}`,cxcText(true))}">✉️ Enviar por correo a ${esc(D.cobMail)}</a>`:""}
  <button class="btn sec full" style="margin-top:8px" data-act="copycxc">Copiar texto completo</button><button class="btn ghost full" data-act="mclose">Cerrar</button>`)}
function cobranza4(){const X=cxcSum();const pct=X.t?Math.round(X.venc/X.t*100):0;
  return `<div class="repbox" style="margin-top:4px"><div class="rbh"><span class="rbi">💳</span><span class="tx"><b>Cuentas por Cobrar</b><small>${X.n} facturas · ${X.cl} clientes · ${pct}% vencido</small></span><span class="mono" style="font-weight:700;font-size:16px">${usd(X.t)}</span></div>
  <div class="cxcin"><div class="bar" style="margin:4px 0 6px">${X.b.map((x,i)=>`<span style="width:${X.t?x/X.t*100:0}%;background:${BUCK[i][1]}"></span>`).join("")}</div>
  <div class="leg" style="margin:0 0 12px">${X.b.map((x,i)=>`<span><i style="background:${BUCK[i][1]}"></i>${BUCK[i][0]} ${usd(x)}</span>`).join("")}</div>
  <button class="btn big full" style="margin-bottom:12px" data-act="cxcrep">📄 Reporte de Cuentas por Cobrar</button>
  ${cobranza4b()}</div></div>`}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act=cxcrep],[data-act=copycxc]");if(!t||!SES||SES.role!=="vend")return;
  if(t.dataset.act==="cxcrep")cxcModal();else copy(cxcText(true))},true);


/* =====================================================================
   v11 · Feedback de vendedores (12 nov 2026)
   kg en productos al peso · editar pedido · abonos · inventario real ·
   meta en kg · lista maestra de clientes · botón Atrás · WhatsApp en iPhone

/* ---------- productos al peso se piden en kg ---------- */
function applyPrices(){const m=LS.get("meister-prices",{}),w=LS.get("meister-pesos",{});
  CAT.forEach(p=>{if(p.pres==="peso"){if(p.pz0==null){p.pz0=p.kg;p.par0=p.par}p.pz=+(w[p.sku]||p.pz0);if(m[p.sku])p.pk=m[p.sku];p.kg=1;p.p=p.pk;p.step=0.5;p.par=Math.max(1,Math.round(p.par0*p.pz))}
    else{if(p.pq0==null){const g=/(\d+)\s*gr/i.exec(p.desc);p.pq0=g?+g[1]/1000:0.5}p.pqkg=+(w[p.sku]||p.pq0);if(m[p.sku])p.p=m[p.sku]}})}
const fmtKg=k=>(Math.round(k*10)/10).toLocaleString("es-VE",{maximumFractionDigits:1})+" kg";
const kgItem=i=>{const p=PROD(i.sku);if(!p)return 0;return p.pres==="peso"?(i.kg!=null?i.kg:i.q):i.q*p.pqkg};
const kgOrder=o=>(o.real?o.real.lines:o.items).reduce((a,i)=>a+kgItem(i),0);
function kgMes(){const m=TODAY.slice(0,7);return S.orders.filter(o=>o.date.slice(0,7)===m).reduce((a,o)=>a+kgOrder(o),0)+S.hist.filter(h=>h.date.slice(0,7)===m).reduce((a,h)=>a+(h.kg!=null?h.kg:h.venta/9),0)}
function habiles(y,mo,hasta){let n=0,t=0;const last=new Date(y,mo+1,0).getDate();for(let d=1;d<=last;d++){const w=new Date(y,mo,d).getDay();if(w&&w!==6){t++;if(d<=hasta)n++}}return{n,t}}

/* ---------- inventario real (lo carga Despacho/Almacén) ---------- */
const INVKEY="meister-inv";
function invGet(){let v=LS.get(INVKEY,null);if(!v){const r=rnd(hash("inv"));v={at:null,by:"",items:{}};CAT.forEach(p=>v.items[p.sku]=p.pres==="peso"?Math.round(60+r()*400):Math.round((10+r()*40))*8);v.demo=true}return v}
function reservado(){const res={};allSellers().forEach(vn=>{const st=vn===(S&&S.vend)?S:stateOf(vn);st.orders.forEach(o=>{const s=withS(st,()=>ostF(o));if(s==="emitida"||s==="aprobacion")o.items.forEach(i=>res[i.sku]=(res[i.sku]||0)+i.q)})});return res}
function dispMap(exclude){const inv=invGet().items;const res=reservado();if(exclude)exclude.items.forEach(i=>res[i.sku]=(res[i.sku]||0)-i.q);const out={};CAT.forEach(p=>out[p.sku]=Math.round(((inv[p.sku]||0)-(res[p.sku]||0))*10)/10);return out}
const uOf=p=>p.pres==="peso"?"kg":"paq";
function dispChip(p,q,D){const d=D[p.sku];const u=uOf(p);if(d<=0)return `<span class="chip c-red">Agotado</span>`;if(q>d)return `<span class="chip c-red">Solo ${d.toLocaleString("es-VE")} ${u}</span>`;return `<span class="chip ${d<p.par*2?"c-amb":"c-grn"}">Disp. ${d.toLocaleString("es-VE")} ${u}</span>`}

/* ---------- catálogo: kg y disponibilidad ---------- */
let _D=null;
function prodRow(p,k){const q=k.items[p.sku]||0;const sug=(suggest(k.cod)||{})[p.sku]||0;const D=_D||dispMap(k.editId&&S.orders.find(o=>o.id===k.editId));
  const pr=p.pres==="peso"?`<span class="mono">${usd(p.pk)}/kg</span> · ${p.ud?`bulto ≈${p.pz.toLocaleString("es-VE")} kg · ${p.ud} ud${p.gu?` de ${Math.round(p.gu)} g`:""}`:`pieza ≈${p.pz.toLocaleString("es-VE")} kg${p.guia?` (${esc(p.guia)})`:""}`}`:`<span class="mono">${usd(p.p)}</span>/paq · ${p.ud?`${p.ud} ud · ${Math.round(p.pqkg*1000)} g`:esc(p.desc)} · caja ${p.step||8}`;
  const ctrl=p.pres==="peso"
   ?(q?`<div class="kgbox"><div class="step"><button data-inc="${p.sku}" data-d="-0.5" aria-label="Quitar">−</button><input data-qty="${p.sku}" value="${q}" inputmode="decimal"><button data-inc="${p.sku}" data-d="0.5" aria-label="Agregar">+</button></div><span class="kgl">kg</span></div>`
      :`<div class="kgadd"><button class="addb" data-inc="${p.sku}" data-d="${p.pz}">+ 1 ${p.ud?"bulto":"pieza"}</button><button class="addb sm2" data-kgset="${p.sku}">kg exactos</button></div>`)
   :(q?`<div class="step"><button data-inc="${p.sku}" data-d="-1" aria-label="Quitar">−</button><input data-qty="${p.sku}" value="${q}" inputmode="numeric"><button data-inc="${p.sku}" data-d="1" aria-label="Agregar">+</button></div>`:`<button class="addb" data-inc="${p.sku}" data-d="1">+ Paquete</button>`);
  return `<div class="prow ${q?"in":""}">${tile(p.sku)}<div class="main"><div class="pn">${esc(p.n)}</div><div class="pp">${pr}</div><div class="pc">${p.inact?`<span class="chip c-red">⚠ ${esc(p.inact)}</span> `:""}${dispChip(p,q,D)}${sug?` <span style="color:#7a5600">sug. ${sug} ${uOf(p)}</span>`:""}${p.pres==="peso"&&q?` · <b class="mono">${usd(q*p.p)}</b>`:""}${q?` <button class="rmq" data-rm="${p.sku}">✕ Quitar</button>`:""}</div></div>${ctrl}</div>`}
function kgModal(sku){const p=PROD(sku);const k=S.cart;const q=k.items[sku]||0;const D=dispMap();
  openModal(`<div class="grab"></div><h3>${esc(p.n)}</h3><div class="muted">${usd(p.pk)}/kg · ${p.ud?`bulto ≈${p.pz.toLocaleString("es-VE")} kg (${p.ud} ud)`:`pieza ≈${p.pz.toLocaleString("es-VE")} kg`} · disponible ${D[sku].toLocaleString("es-VE")} kg</div>
  <label class="f">Peso en kilogramos</label><input id="kgv" type="number" step="0.01" min="0" inputmode="decimal" value="${q||""}" placeholder="Ej. 2,5" style="font-size:24px">
  <div class="chips wrap" style="margin-top:10px">${[0.5,1,2,5,10].map(x=>`<button data-kgq="${x}">${x.toLocaleString("es-VE")} kg</button>`).join("")}<button data-kgq="${p.pz}">1 ${p.ud?"bulto":"pieza"} (${p.pz.toLocaleString("es-VE")})</button><button data-kgq="${Math.round(p.pz*2*100)/100}">2 ${p.ud?"bultos":"piezas"}</button></div>
  <div class="muted" id="kgeq" style="margin-top:6px"></div>
  <button class="btn big full" style="margin-top:12px" data-act="kgsave" data-sku="${sku}">Agregar al pedido</button><button class="btn ghost full" data-act="mclose">Cancelar</button>`,
  ()=>{const u=()=>{const v=parseFloat(String($("#kgv").value).replace(",","."))||0;$("#kgeq").innerHTML=v?`≈ <b>${usd(v*p.pk)}</b> · ${p.gu&&p.ud?Math.round(v*1000/p.gu)+" unidades aprox.":(v/p.pz).toLocaleString("es-VE",{maximumFractionDigits:1})+" pieza(s)"}`:""};$("#kgv").oninput=u;u();setTimeout(()=>$("#kgv").focus(),100)})}

/* ---------- editar pedido ---------- */
function editOrder(id){const o=S.orders.find(x=>x.id===id);if(!o)return;const items={};o.items.forEach(i=>items[i.sku]=i.q);
  S.cart={cod:o.cod,items,pdv:o.pdv.id||"P0",entrega:o.entrega,obs:o.obs||"",sig:o.sig||null,visit:false,editId:o.id};save();UI.modal=null;UI.page=null;UI.tab="venta";render();scrollTo(0,0);toast("Editando "+o.id)}
function applyEdit(k){const o=S.orders.find(x=>x.id===k.editId);const items=Object.entries(k.items).filter(([s,q])=>q>0&&PROD(s)).map(([sku,q])=>({sku,q,p:PROD(sku).p}));
  const sub=items.reduce((a,i)=>a+i.q*i.p,0);Object.assign(o,{items,sub,iva:sub*IVA,tot:sub*(1+IVA),pdv:pdvs(k.cod).find(p=>p.id===k.pdv)||pdvs(k.cod)[0],entrega:k.entrega,obs:k.obs,sig:k.sig||o.sig,edited:Date.now(),sentFac:null});
  o.aprob=needsApproval(S,k.cod)?(o.aprob==="aprobada"?"aprobada":"pendiente"):o.aprob;return o}

/* ---------- modal de pedido: Editar + Abono ---------- */

const MASTER=window.__D.MASTER;
const normT=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function masterFind(q,lim){q=normT(q).trim();if(q.length<2)return[];const mine=new Set(clients().map(c=>c.cod));const out=[];
  for(const m of MASTER){if(mine.has(m[0]))continue;if(normT(m[1]).includes(q)||m[0].toLowerCase().includes(q)||(m[3]||"").replace(/\D/g,"").includes(q.replace(/\D/g,"")||"#")){out.push(m);if(out.length>=(lim||20))break}}return out}
const masterOf=cod=>MASTER.find(m=>m[0]===cod);
function addFromMaster(cod){if(cli(cod))return cli(cod);const m=masterOf(cod);if(!m)return null;const c={cod:m[0],nombre:m[1].toUpperCase(),dir:m[2],tel:m[3],cred:0,esp:false,facturas:[],master:true};S.newClients.push(c);save();return c}
function masterRows(q,act){const L=masterFind(q);if(!L.length)return"";
  return `<div class="sec-t">En la lista maestra de Meister · ${MASTER.length.toLocaleString("es-VE")} clientes</div>${L.map(m=>`<div class="ccard" data-${act}="${m[0]}"><span class="av" style="background:var(--brnbg);color:var(--brn)">📇</span><div class="main"><div class="nm">${esc(m[1])}</div><div class="meta"><span class="mono" style="font-size:11px">${m[0]}</span>${m[2]?`<span>${esc(m[2].slice(0,40))}</span>`:""}</div></div><span class="chip c-blu">＋ Agregar</span></div>`).join("")}`}
function sellList(cl,q){const mine=cl.filter(c=>!q||normT(c.nombre).includes(normT(q))||c.cod.toLowerCase().includes(q)).slice(0,q?80:40).map(c=>`<div class="ccard" data-sell="${c.cod}"><span class="av">${ini(c.nombre.replace(/[^A-ZÁÉÍÓÚÑ ]/gi,"")||"CL")}</span><div class="main"><div class="nm">${esc(c.nombre)}</div><div class="meta"><span class="mono" style="font-size:11px">${c.cod}</span><span class="chip">${c.cred?`Crédito ${c.cred}d`:"Contado"}</span>${c.master?'<span class="chip" style="background:var(--brnbg);color:var(--brn)">Lista maestra</span>':""}</div></div><span class="muted" style="font-size:20px">›</span></div>`).join("");

function hoyRuta(){const d=today.getDay();return{w:Math.min(4,Math.ceil(today.getDate()/7))-1,d:d>=1&&d<=5?d-1:null}}
function rutaDia(w,d){const R=rutero();if(!R||d==null)return[];return R.sem.at(w).at(d)||[]}
function rutaHoy(){const h=hoyRuta();return rutaDia(h.w,h.d)}
const routeN=()=>rutero()?rutaHoy().length:0;
function ensureClient(cod){if(cli(cod))return cli(cod);const m=masterOf(cod);if(m)return addFromMaster(cod);
  const R=rutero();let e=null;if(R)R.sem.forEach(w=>w.forEach(d=>d.forEach(x=>{if(x.c===cod)e=x})));if(!e)return null;
  const c={cod,nombre:e.n.toUpperCase(),cred:0,esp:false,facturas:[],route:true,sinMaestra:true};S.newClients.push(c);save();return c}
function rName(e){return String(e.n||"").toUpperCase()||((cli(e.c)||{}).nombre)||e.c}
function nextClient(){const R=rutero();if(!R)return SEED[S.vend].concat(S.newClients).find(c=>!(visitOf(c.cod)||{}).closed);
  const L=rutaHoy();const e=L.find(x=>!(visitOf(x.c)||{}).closed);if(!e)return null;
  return cli(e.c)||{cod:e.c,nombre:rName(e),cred:(masterOf(e.c)?0:0),esp:false,facturas:[],pseudo:true}}
function visitPos(nx,cl){const R=rutero();if(!R){const L=SEED[S.vend];const i=L.findIndex(c=>c.cod===nx.cod);return i>=0?`${i+1} de ${L.length}`:"fuera de ruta"}const L=rutaHoy();return `${L.findIndex(x=>x.c===nx.cod)+1} de ${L.length} en ruta`}

  ${L.length?L.map((e,i)=>{const v=visitOf(e.c);const done=esHoy&&v&&v.closed;const ped=esHoy&&S.orders.some(o=>o.cod===e.c&&o.date===TODAY);const a=ACT[e.a]||[e.a,""];const nm=rName(e);const sin=!masterOf(e.c)&&!cli(e.c);
